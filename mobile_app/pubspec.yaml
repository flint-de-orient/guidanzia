name: edubot_mobile
description: "EduBot — AI career counselling for Indian students (Flutter mobile app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  http: ^1.2.2

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI / design
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8

  # PDF + external links
  printing: ^5.13.4
  pdf: ^3.11.1
  file_saver: ^0.2.14
  url_launcher: ^6.3.1
  intl: any
  flutter_native_splash: ^2.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mascot/
    - assets/games/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf

# Native launch / splash screen (branded, theme-aware). Generated with:
#   dart run flutter_native_splash:create
# Static logo on the brand field (white in light, navy in dark); the OS renders
# it. The in-app "arrival" animation (LandingBody) provides the motion. No
# runtime Dart from this package — config/CLI only.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B1020"
  image: assets/images/splash_logo_light.png
  image_dark: assets/images/splash_logo_dark.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#0B1020"
    image: assets/images/splash_android12_light.png
    image_dark: assets/images/splash_android12_dark.png
