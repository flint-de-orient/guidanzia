<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia | Cognitive Challenge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;family=Be+Vietnam+Pro:wght@100..900&amp;family=Hanken+Grotesk:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#785a00",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#282f48",
                        "surface-container-low": "#f2f3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#004f50",
                        "tertiary-container": "#4bdfdf",
                        "surface-container-high": "#e3e7ff",
                        "primary-fixed": "#ffdf9d",
                        "outline": "#807663",
                        "tertiary-fixed": "#69f7f7",
                        "on-primary-fixed-variant": "#5b4300",
                        "outline-variant": "#d2c5b0",
                        "error": "#ba1a1a",
                        "surface": "#faf8ff",
                        "on-tertiary-container": "#006060",
                        "inverse-on-surface": "#eff0ff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#546d00",
                        "secondary-fixed-dim": "#abd533",
                        "inverse-primary": "#f0c04d",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d2d9f9",
                        "on-primary-container": "#6d5100",
                        "on-secondary-fixed-variant": "#3a4d00",
                        "surface-container-highest": "#dbe1ff",
                        "tertiary-fixed-dim": "#45dada",
                        "surface-container": "#ebedff",
                        "on-primary-fixed": "#251a00",
                        "secondary": "#4f6700",
                        "background": "#fcf8fd",
                        "tertiary": "#006a6a",
                        "on-surface": "#131b32",
                        "on-surface-variant": "#4e4635",
                        "surface-variant": "#dbe1ff",
                        "on-tertiary-fixed": "#002020",
                        "surface-tint": "#785a00",
                        "on-secondary-fixed": "#151f00",
                        "on-error": "#ffffff",
                        "surface-bright": "#faf8ff",
                        "secondary-fixed": "#89b100",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-container": "#c6f24e",
                        "on-background": "#131b32",
                        "primary-fixed-dim": "#f0c04d",
                        "primary-container": "#f5c451",
                        "navy-border": "#e3e7ff",
                        "muted-blue": "#8E9BC4",
                        "deep-navy": "#131b32",
                        "grad-gold": "#f5c451"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "puzzle": "24px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "stack-lg": "48px",
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "stack-md": "24px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-md-mobile": ["Sora"],
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-bold": ["Hanken Grotesk"],
                        "headline-md": ["Sora"],
                        "display-xl": ["Sora"],
                        "headline-sm": ["Sora"],
                        "display-lg-mobile": ["Sora"],
                        "display-lg": ["Sora"]
                    },
                    "fontSize": {
                        "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                        "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                        "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes countdown {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 100; }
        }

        .timer-ring {
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
            animation: countdown 15s linear forwards;
        }

        .correct-flash {
            animation: correct-scale 0.5s ease-out forwards;
            background-color: #f5c451 !important;
            border-color: #f5c451 !important;
            color: #131b32 !important;
        }

        .incorrect-flash {
            animation: incorrect-dim 0.5s ease-out forwards;
            background-color: #ba1a1a !important;
            border-color: #ba1a1a !important;
            color: #ffffff !important;
        }

        @keyframes correct-scale {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.05); }
        }

        @keyframes incorrect-dim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Header Section -->
<header class="flex items-center justify-between px-margin-mobile pt-12 pb-6 z-10">
<!-- Countdown Timer -->
<div class="relative w-10 h-10 flex items-center justify-center">
<svg class="w-full h-full -rotate-90">
<circle class="text-surface-container" cx="20" cy="20" fill="transparent" r="18" stroke="currentColor" stroke-width="3"></circle>
<circle class="timer-ring" cx="20" cy="20" fill="transparent" r="18" stroke="#89b100" stroke-width="3"></circle>
</svg>
<span class="absolute text-[10px] font-bold text-secondary-fixed">12s</span>
</div>
<!-- Progress Text -->
<div class="text-center">
<p class="font-label-bold text-on-surface-variant tracking-widest uppercase">Question 3 of 4</p>
</div>
<!-- Pause Button -->
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest hover:bg-surface-container transition-colors border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile space-y-12 pb-32">
<!-- Puzzle Sequence -->
<section class="w-full text-center z-10">
<div class="flex flex-wrap items-baseline justify-center gap-x-4 gap-y-2">
<span class="font-display-lg-mobile text-deep-navy tracking-tighter">2,</span>
<span class="font-display-lg-mobile text-deep-navy tracking-tighter">4,</span>
<span class="font-display-lg-mobile text-deep-navy tracking-tighter">8,</span>
<div class="inline-flex items-center justify-center w-20 h-16 bg-grad-gold rounded-lg border-2 border-primary animate-pulse mx-2">
<span class="sr-only">Missing Value</span>
</div>
<span class="font-display-lg-mobile text-deep-navy tracking-tighter">, 32</span>
</div>
<p class="mt-8 font-body-md text-on-surface-variant max-w-[240px] mx-auto">Identify the logical growth pattern to find the missing variable.</p>
</section>
<!-- Interaction Area (2x2 Grid) -->
<section class="w-full max-w-sm z-10">
<div class="grid grid-cols-2 gap-4">
<!-- Card 1 -->
<button class="answer-card group relative aspect-square flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-puzzle hover:border-grad-gold transition-all active:scale-95 duration-200" onclick="handleSelection(this, false)">
<span class="font-display-lg-mobile text-deep-navy group-hover:text-primary transition-colors">12</span>
</button>
<!-- Card 2 (Correct One) -->
<button class="answer-card group relative aspect-square flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-puzzle hover:border-grad-gold transition-all active:scale-95 duration-200" onclick="handleSelection(this, true)">
<span class="font-display-lg-mobile text-deep-navy group-hover:text-primary transition-colors">16</span>
</button>
<!-- Card 3 -->
<button class="answer-card group relative aspect-square flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-puzzle hover:border-grad-gold transition-all active:scale-95 duration-200" onclick="handleSelection(this, false)">
<span class="font-display-lg-mobile text-deep-navy group-hover:text-primary transition-colors">14</span>
</button>
<!-- Card 4 -->
<button class="answer-card group relative aspect-square flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-puzzle hover:border-grad-gold transition-all active:scale-95 duration-200" onclick="handleSelection(this, false)">
<span class="font-display-lg-mobile text-deep-navy group-hover:text-primary transition-colors">20</span>
</button>
</div>
</section>
</main>
<!-- Visual Glow Overlay -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-[30%] bg-primary-fixed opacity-10 blur-[120px] pointer-events-none"></div>
<script>
        function handleSelection(element, isCorrect) {
            const allCards = document.querySelectorAll('.answer-card');
            
            // Disable all buttons to prevent double-tapping
            allCards.forEach(card => card.style.pointerEvents = 'none');

            if (isCorrect) {
                element.classList.add('correct-flash');
                if (window.navigator.vibrate) window.navigator.vibrate(50);
            } else {
                element.classList.add('incorrect-flash');
                if (window.navigator.vibrate) window.navigator.vibrate([30, 50, 30]);
                
                // Show correct answer after brief delay if user was wrong
                setTimeout(() => {
                    const correctCard = Array.from(allCards).find(c => c.textContent.trim() === '16');
                    if (correctCard) correctCard.classList.add('correct-flash');
                }, 300);
            }

            // Navigate after animation
            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.4s ease-out';
                setTimeout(() => window.location.reload(), 500);
            }, 1000);
        }

        // Micro-interaction: Periodic shimmer on the missing value box
        setInterval(() => {
            const missingBox = document.querySelector('.animate-pulse');
            if(missingBox) {
                missingBox.style.boxShadow = "0 0 20px rgba(120, 90, 0, 0.2)";
                setTimeout(() => {
                    missingBox.style.boxShadow = "none";
                }, 500);
            }
        }, 3000);
    </script>
</body></html>
