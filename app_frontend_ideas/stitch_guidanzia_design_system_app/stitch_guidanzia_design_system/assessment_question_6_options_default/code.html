<!DOCTYPE html>

<html class="light" lang="en"><head>

                            "tertiary-fixed": "#69f7f7",
                            "on-primary-fixed-variant": "#5b4300",
                            "outline-variant": "#d2c5b0",
                            "error": "#ba1a1a",
                            "surface": "#fcf8fd", // Cloud White

                            "on-secondary-fixed-variant": "#3a4d00",
                            "surface-container-highest": "#dbe1ff",
                            "tertiary-fixed-dim": "#45dada",
                            "surface-container": "#ebedff",
                            "on-primary-fixed": "#251a00",
                            "secondary": "#4f6700", // Darker Lime/Green for contrast
                            "background": "#fcf8fd", // Cloud White
                            "tertiary": "#006a6a",
                            "on-surface": "#0b0a3d", // Deep Navy
                            "on-surface-variant": "#4e4635",
                            "surface-variant": "#dbe1ff",
                            "on-tertiary-fixed": "#002020",
                            "surface-tint": "#785a00",
                            "on-secondary-fixed": "#151f00",
                            "on-error": "#ffffff",
                            "surface-bright": "#faf8ff",
                            "secondary-fixed": "#c6f24e",
                            "on-tertiary": "#ffffff",
                            "on-error-container": "#93000a",
                            "secondary-container": "#c6f24e",
                            "on-background": "#0b0a3d", // Deep Navy
                            "primary-fixed-dim": "#f0c04d",
                            "primary-container": "#f5c451"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "stack-md": "24px",
                            "margin-mobile": "20px",
                            "stack-lg": "48px",
                            "stack-sm": "8px",
                            "margin-desktop": "40px",
                            "unit": "4px",
                            "gutter": "16px"
                        },
                        "fontFamily": {
                            "headline-sm": ["Sora"],
                            "display-xl": ["Sora"],
                            "display-lg-mobile": ["Sora"],
                            "headline-md": ["Sora"],
                            "label-bold": ["Hanken Grotesk"],
                            "body-lg": ["Be Vietnam Pro"],
                            "body-md": ["Be Vietnam Pro"],

                            "display-lg": ["Sora"]
                        },
                        "fontSize": {
                            "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                            "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                            "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                            "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                            "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                            "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                            "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                            "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}]
                        }
                    },
                },
            }
        } catch (_e) {}
    </script>
<style>
        .progress-rail-container {
            display: flex;
            gap: 4px;
            padding: 12px 20px 8px;
        }
        .progress-tick {
            height: 4px;
            flex: 1;
            border-radius: 2px;
        }
        .progress-tick.completed { background-color: #785a00; } /* Graduation Gold */
        .progress-tick.current { background-color: #c6f24e; } /* Lime */
        .progress-tick.muted { background-color: #e3e7ff; }
        
        .blurred-nav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(11, 10, 61, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary/30 selection:text-on-background overflow-x-hidden">
<!-- Progress Indicator Rail -->
<div class="w-full fixed top-0 z-50 bg-background/95 backdrop-blur-sm">
<div class="progress-rail-container">
<!-- 1-5 Completed -->
<div class="progress-tick completed"></div>
<div class="progress-tick completed"></div>
<div class="progress-tick completed"></div>
<div class="progress-tick completed"></div>
<div class="progress-tick completed"></div>
<!-- 6 Current -->
<div class="progress-tick current"></div>
<!-- 7-20 Muted -->
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
<div class="progress-tick muted"></div>
</div>
<div class="px-margin-mobile pb-4">
<span class="font-label-bold text-label-bold text-on-surface/60 tracking-wider uppercase">Module 3 · Question 6 of 20</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="pt-32 pb-32 px-margin-mobile max-w-xl mx-auto">
<!-- Question Section -->
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-stack-lg leading-tight">
            Which of these team environments feels most productive to you?
        </h1>
<!-- Options Zone -->
<div class="grid grid-cols-1 gap-3">
<!-- Option 1 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="groups">groups</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Collaborative Studio</span>
</button>
<!-- Option 2 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="psychology">psychology</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Quiet Focus</span>
</button>
<!-- Option 3 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="rocket_launch">rocket_launch</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Fast-Paced Startup</span>
</button>
<!-- Option 4 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="home_work">home_work</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Remote Autonomy</span>
</button>
<!-- Option 5 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="architecture">architecture</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Structured Agency</span>
</button>
<!-- Option 6 -->
<button class="option-card flex items-center h-[64px] px-6 bg-surface-container-low border-2 border-transparent rounded-xl group hover:border-primary transition-all text-left w-full outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined text-secondary mr-4" data-icon="diversity_3">diversity_3</span>
<span class="font-label-bold text-label-bold text-on-surface group-hover:text-primary">Social Impact</span>
</button>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 blurred-nav bg-surface/90 h-24 flex items-center px-margin-mobile">
<div class="flex justify-between items-center w-full max-w-xl mx-auto">
<!-- Back Button -->
<button class="p-3 text-on-surface/60 hover:text-primary transition-colors rounded-full hover:bg-surface-container-high outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-3xl" data-icon="chevron_left">chevron_left</span>
</button>
<!-- Continue Button -->
<button class="px-8 py-3 bg-on-surface/10 text-on-surface/30 font-label-bold text-label-bold rounded-full cursor-not-allowed border-2 border-transparent transition-all flex items-center gap-2 shadow-sm" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Micro-interactions Script -->
<script>
        const cards = document.querySelectorAll('.option-card');
        const continueBtn = document.getElementById('continue-btn');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Reset all
                cards.forEach(c => {
                    c.classList.remove('border-primary', 'bg-primary/5', 'ring-2', 'ring-primary/20');
                    c.classList.add('border-transparent', 'bg-surface-container-low');
                    c.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                    c.querySelector('span:last-child').classList.remove('text-primary');
                });

                // Set active
                card.classList.remove('border-transparent', 'bg-surface-container-low');
                card.classList.add('border-primary', 'bg-primary/5', 'ring-2', 'ring-primary/20');
                card.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                card.querySelector('span:last-child').classList.add('text-primary');

                // Enable continue button with Graduation Gold/Lime theme
                if(continueBtn) {
                    continueBtn.removeAttribute('disabled');
                    continueBtn.classList.remove('bg-on-surface/10', 'text-on-surface/30', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'shadow-md', 'hover:scale-[1.02]', 'active:scale-[0.98]');
                }
            });
        });
    </script>
</body></html>
