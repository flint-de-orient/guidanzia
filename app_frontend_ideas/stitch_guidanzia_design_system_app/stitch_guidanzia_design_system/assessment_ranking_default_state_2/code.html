<body class="flex flex-col min-h-screen">
<!-- Progress Header Section -->
<header class="pt-8 px-margin-mobile space-y-4">
<!-- Segmented Rail: 20 Ticks -->
<div class="flex items-end justify-between gap-1 w-full h-8">

<!-- Current (2) -->

<!-- Remaining (3-20) -->
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>

<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>

<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
<div class="h-4 flex-1 bg-surface-container-high rounded-full progress-tick"></div>
</div>
<p class="font-label-bold text-label-bold text-on-surface-variant tracking-wider uppercase">
        Module 4 · Question 2 of 20
    </p>
</header>
<!-- Question Canvas -->
<main class="flex-grow px-margin-mobile pt-10 pb-32">
<h1 class="font-display-lg-mobile text-[34px] leading-tight text-on-surface mb-2">
        Rank your top interests
    </h1>
<p class="font-body-md text-on-surface-variant mb-stack-md opacity-70">
        Select your top 2 in order
    </p>
<!-- Ranking List -->
<div class="space-y-4">
<!-- Card 1 -->
<div class="card-interaction h-[78px] bg-surface-container-low border-2 border-transparent rounded-xl px-4 flex items-center gap-4 group transition-all duration-200 cursor-pointer hover:border-outline-variant">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-tertiary/10 border border-tertiary/20">
<span class="material-symbols-outlined text-tertiary" data-icon="terminal">terminal</span>
</div>
<span class="font-label-bold text-[17px] text-on-surface">Software Architecture</span>
<div class="ml-auto w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Card 2 -->
<div class="card-interaction h-[78px] bg-surface-container-low border-2 border-transparent rounded-xl px-4 flex items-center gap-4 group transition-all duration-200 cursor-pointer hover:border-outline-variant">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-secondary/10 border border-secondary/20">
<span class="material-symbols-outlined text-secondary" data-icon="database">database</span>
</div>
<span class="font-label-bold text-[17px] text-on-surface">Data Engineering</span>
<div class="ml-auto w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Card 3 -->
<div class="card-interaction h-[78px] bg-surface-container-low border-2 border-transparent rounded-xl px-4 flex items-center gap-4 group transition-all duration-200 cursor-pointer hover:border-outline-variant">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-tint/10 border border-surface-tint/20">
<span class="material-symbols-outlined text-surface-tint" data-icon="brush">brush</span>
</div>
<span class="font-label-bold text-[17px] text-on-surface">Product Design (UX/UI)</span>
<div class="ml-auto w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Card 4 -->
<div class="card-interaction h-[78px] bg-surface-container-low border-2 border-transparent rounded-xl px-4 flex items-center gap-4 group transition-all duration-200 cursor-pointer hover:border-outline-variant">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-error/10 border border-error/20">
<span class="material-symbols-outlined text-error" data-icon="monitoring">monitoring</span>
</div>
<span class="font-label-bold text-[17px] text-on-surface">Business Strategy</span>
<div class="ml-auto w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Card 5 -->
<div class="card-interaction h-[78px] bg-surface-container-low border-2 border-transparent rounded-xl px-4 flex items-center gap-4 group transition-all duration-200 cursor-pointer hover:border-outline-variant">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-primary-fixed/10 border border-primary-fixed/20">
<span class="material-symbols-outlined text-primary" data-icon="psychology">psychology</span>

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile pb-8 pt-6 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/30">
<!-- Back Button -->
<button class="flex items-center justify-center text-on-surface-variant px-6 py-4 hover:bg-surface-container-low rounded-full transition-all duration-200">
<span class="material-symbols-outlined mr-2" data-icon="chevron_left">chevron_left</span>
<span class="font-label-bold text-label-bold">Back</span>
</button>
<!-- Continue Button -->
<button class="flex items-center justify-center bg-outline-variant/20 text-on-surface-variant/40 rounded-full px-8 py-4 cursor-not-allowed transition-all duration-300">
<span class="font-label-bold text-label-bold mr-2">Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</nav>
<!-- Micro-interaction Script -->
<script>
    document.querySelectorAll('.card-interaction').forEach(card => {
        card.addEventListener('click', function() {
            const radio = this.querySelector('.ml-auto');
            const isSelected = radio.classList.contains('bg-secondary-container');
            
            if(!isSelected) {
                // Selection logic
                radio.classList.remove('border-outline-variant');
                radio.classList.add('bg-secondary-container', 'border-secondary-container', 'flex', 'items-center', 'justify-center');
                radio.innerHTML = '<span class="material-symbols-outlined text-[14px] text-on-secondary-container font-bold" data-icon="check" style="font-variation-settings: \'opsz\' 16">check</span>';
                this.classList.add('border-secondary-container', 'bg-white', 'shadow-sm');
                this.classList.remove('bg-surface-container-low');
            } else {
                // Deselection logic
                radio.classList.add('border-outline-variant');
                radio.classList.remove('bg-secondary-container', 'border-secondary-container', 'flex', 'items-center', 'justify-center');
                radio.innerHTML = '';
                this.classList.remove('border-secondary-container', 'bg-white', 'shadow-sm');
                this.classList.add('bg-surface-container-low');
            }

            // Check if any selections are made to enable Continue button
            const selectedCount = document.querySelectorAll('.bg-secondary-container').length;
            const continueBtn = document.querySelector('nav button:last-child');
            if(selectedCount > 0) {
                continueBtn.classList.remove('bg-outline-variant/20', 'text-on-surface-variant/40', 'cursor-not-allowed');
                continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-lg', 'shadow-primary/20');
            } else {
                continueBtn.classList.add('bg-outline-variant/20', 'text-on-surface-variant/40', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-lg', 'shadow-primary/20');
            }
        });
    });
</script>
</body></html>
