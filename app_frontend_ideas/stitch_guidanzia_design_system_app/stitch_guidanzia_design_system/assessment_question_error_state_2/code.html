<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf8fd;
            color: #0b0a3d;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-btn-disabled {
            box-shadow: none;
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #e3e7ff;
            color: #0b0a3d;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 w-full flex justify-between items-center px-margin-mobile h-16 z-50 bg-surface border-b border-outline-variant/30">
<button class="text-on-surface p-2">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex-1 flex justify-center">
<div class="w-2/3 bg-surface-container-highest h-2 rounded-full overflow-hidden">
<div class="bg-secondary h-full w-1/4 rounded-full"></div>
</div>
</div>
<div class="w-10 h-10 rounded-full border-2 border-primary/20 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A profile avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtev5PFPGGPkBNWpbhxudtw8p2QqzrKIcNacSl176zktjx1o02q6iuoaHkPafo6TDRQeA9VG9mfofEt0jfREEz-nRlQ1EYiTJPk4PEtEG2lEMY2ieZ5-2DBBtS31vbvI3TjF3HZrIIhYpbDmhmeWG_lRNZRJ7exROYTZ_jRf4Mk0TAm350n96UmEwC1AREuRo4uJ67wGrh1YQPd-lMLqZMXTaugn85hu3K4yS-HZMYoggYyuucUhgaxMZujyJT_SLPpnfLAKhz2D0"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-mobile pt-stack-md pb-stack-lg overflow-y-auto">
<!-- Question Section -->
<section class="mb-stack-md">
<span class="font-label-bold text-label-bold text-primary mb-unit block uppercase tracking-widest">Question 04/12</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-stack-sm leading-tight">
            When working on a complex project, which approach feels most natural to you?
        </h1>
</section>
<!-- Options List -->
<div class="space-y-4">
<!-- Option 1 -->
<button class="w-full text-left p-stack-md bg-white border-2 border-outline-variant/40 rounded-xl flex items-center gap-4 transition-all active:scale-95 shadow-sm">
<div class="w-6 h-6 border-2 border-outline rounded-full flex-shrink-0"></div>
<span class="font-body-lg text-body-lg text-on-surface">Mapping out every detail and deadline before starting.</span>
</button>
<!-- Option 2 -->
<button class="w-full text-left p-stack-md bg-white border-2 border-outline-variant/40 rounded-xl flex items-center gap-4 transition-all active:scale-95 shadow-sm">
<div class="w-6 h-6 border-2 border-outline rounded-full flex-shrink-0"></div>
<span class="font-body-lg text-body-lg text-on-surface">Diving straight into the core problem and iterating as I go.</span>
</button>
<!-- Option 3 -->
<button class="w-full text-left p-stack-md bg-white border-2 border-outline-variant/40 rounded-xl flex items-center gap-4 transition-all active:scale-95 shadow-sm">
<div class="w-6 h-6 border-2 border-outline rounded-full flex-shrink-0"></div>
<span class="font-body-lg text-body-lg text-on-surface">Collaborating with others to brainstorm multiple perspectives.</span>
</button>
<!-- Option 4 -->
<button class="w-full text-left p-stack-md bg-white border-2 border-outline-variant/40 rounded-xl flex items-center gap-4 transition-all active:scale-95 shadow-sm">
<div class="w-6 h-6 border-2 border-outline rounded-full flex-shrink-0"></div>
<span class="font-body-lg text-body-lg text-on-surface">Focusing on the visual presentation and user experience first.</span>
</button>
</div>
</main>
<!-- Error & Action Sticky Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface">
<!-- Inline Error Message -->
<div class="w-full">
<div class="border-t border-outline-variant/30 mx-margin-mobile"></div>
<div class="px-margin-mobile py-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">error</span>
<p class="font-label-bold text-label-bold text-on-surface">Please select an option to continue</p>
</div>
</div>
<!-- Action Button -->
<div class="px-margin-mobile pb-8 pt-2">
<button class="w-full h-14 bg-primary text-on-primary font-label-bold text-label-bold rounded-full uppercase tracking-widest glow-btn-disabled" disabled="">
            Continue
        </button>
</div>
</footer>
<!-- Ambient background textures -->
<div class="fixed top-1/2 -right-20 w-64 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none -z-10"></div>
<div class="fixed bottom-0 -left-20 w-80 h-80 bg-secondary/10 blur-[100px] rounded-full pointer-events-none -z-10"></div>
<script>
    document.querySelectorAll('button[class*="bg-white"]').forEach(button => {
        button.addEventListener('click', () => {
            // Clear all previous selections
            document.querySelectorAll('button[class*="bg-white"]').forEach(btn => {
                btn.classList.remove('border-primary', 'bg-primary-container/10');
                btn.classList.add('border-outline-variant/40');
                const radio = btn.querySelector('div');
                radio.classList.remove('bg-primary', 'border-primary');
                radio.innerHTML = '';
            });

            // Set active state
            button.classList.remove('border-outline-variant/40');
            button.classList.add('border-primary', 'bg-primary-container/10');
            const radio = button.querySelector('div');
            radio.classList.add('bg-primary', 'border-primary');
            radio.innerHTML = '<span class="material-symbols-outlined text-on-primary" style="font-size: 16px; font-weight: bold;">check</span>';

            // Hide error and enable button
            const errorSection = document.querySelector('footer > div:first-child');
            if (errorSection) errorSection.style.display = 'none';
            
            const continueBtn = document.querySelector('button[disabled]');
            if(continueBtn) {
                continueBtn.removeAttribute('disabled');
                continueBtn.classList.remove('glow-btn-disabled');
                continueBtn.style.boxShadow = '0 10px 15px -3px rgba(120, 90, 0, 0.2)';
            }
        });
    });
</script>
</body></html>
