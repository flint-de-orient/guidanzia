<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia Assessment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .action-glow-gold {
            box-shadow: 0 4px 20px rgba(120, 90, 0, 0.15);
        }
        body {
            background-color: #fcf8fd;
            color: #131b32;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#dbe1ff",
                      "tertiary-container": "#4bdfdf",
                      "outline": "#807663",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-container": "#546d00",
                      "surface-container-low": "#f2f3ff",
                      "primary": "#785a00",
                      "surface-container-high": "#e3e7ff",
                      "tertiary-fixed": "#69f7f7",
                      "on-primary-fixed": "#251a00",
                      "on-background": "#0b0a3d",
                      "surface-container-highest": "#dbe1ff",
                      "secondary-fixed-dim": "#abd533",
                      "on-tertiary-container": "#006060",
                      "on-primary-fixed-variant": "#5b4300",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#c6f24e",
                      "surface-tint": "#785a00",
                      "surface": "#fcf8fd",
                      "inverse-on-surface": "#eff0ff",
                      "tertiary": "#006a6a",
                      "on-secondary-fixed": "#151f00",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#f0c04d",
                      "on-surface-variant": "#4e4635",
                      "primary-container": "#f5c451",
                      "secondary": "#4f6700",
                      "inverse-surface": "#282f48",
                      "surface-dim": "#d2d9f9",
                      "on-primary-container": "#6d5100",
                      "primary-fixed": "#ffdf9d",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#3a4d00",
                      "tertiary-fixed-dim": "#45dada",
                      "on-tertiary-fixed": "#002020",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed-variant": "#004f50",
                      "surface-bright": "#faf8ff",
                      "inverse-primary": "#f0c04d",
                      "on-error-container": "#93000a",
                      "surface-container": "#ebedff",
                      "background": "#fcf8fd",
                      "on-surface": "#0b0a3d",
                      "secondary-container": "#c6f24e",
                      "outline-variant": "#d2c5b0"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter": "16px",
                      "margin-mobile": "20px",
                      "stack-md": "24px",
                      "stack-sm": "8px",
                      "margin-desktop": "40px",
                      "stack-lg": "48px"
              },
              "fontFamily": {
                      "display-lg-mobile": ["Sora"],
                      "headline-sm": ["Sora"],
                      "body-md": ["Be Vietnam Pro"],
                      "label-bold": ["Hanken Grotesk"],
                      "display-lg": ["Sora"],
                      "body-lg": ["Be Vietnam Pro"],
                      "headline-md-mobile": ["Sora"],
                      "display-xl": ["Sora"],
                      "headline-md": ["Sora"]
              },
              "fontSize": {
                      "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                      "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                      "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                      "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                      "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background flex flex-col min-h-screen text-on-background">
<!-- Sticky Top Header (Progress Bar) -->
<header class="sticky top-0 z-50 bg-background/95 backdrop-blur-sm pt-8 pb-4 px-margin-mobile">
<div class="flex items-center justify-between gap-4">
<!-- Progress Bar: 20 ticks -->
<div class="flex items-end gap-1 flex-1 h-6">
<!-- Ticks 1-4: Filled Gold -->
<div class="w-1.5 h-3 rounded-full bg-primary-container"></div>
<div class="w-1.5 h-3 rounded-full bg-primary-container"></div>
<div class="w-1.5 h-3 rounded-full bg-primary-container"></div>
<div class="w-1.5 h-3 rounded-full bg-primary-container"></div>
<!-- Tick 5: Current (Acid Lime & Taller) -->
<div class="w-1.5 h-5 rounded-full bg-secondary"></div>
<!-- Ticks 6-20: Muted Gray/Blue Hairline -->
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
<div class="w-1.5 h-3 rounded-full bg-surface-container"></div>
</div>
<!-- Module Text -->
<span class="font-label-bold text-label-bold text-on-surface-variant whitespace-nowrap">Module 2 of 6</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-8 pb-32">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-stack-lg leading-tight">
            Which environment helps you do your best work?
        </h1>
<!-- Answer Options -->
<div class="flex flex-col gap-4">
<!-- Card 1 (Selected) -->
<button class="w-full bg-primary-container border-2 border-primary-container rounded-[24px] p-6 text-left flex gap-4 transition-all scale-[1.02] duration-300 shadow-md">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 28px;">hub</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-primary-container mb-1">Collaborative Studio</h3>
<p class="font-body-md text-body-md text-on-primary-container/80">High-energy brainstorming with a team.</p>
</div>
</button>
<!-- Card 2 -->
<button class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">laptop</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Quiet Focus</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Deep work in a peaceful, solo space.</p>
</div>
</button>
<!-- Card 3 -->
<button class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">groups</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Client Facing</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Presenting ideas and managing relationships.</p>
</div>
</button>
<!-- Card 4 -->
<button class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">science</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">The Lab</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Testing, experimenting, and refining.</p>
</div>
</button>
</div>
</main>
<!-- Bottom Actions -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile flex items-center justify-between bg-gradient-to-t from-background via-background/90 to-transparent pt-12 pb-8 z-50">
<button class="font-label-bold text-label-bold text-on-surface-variant px-4 py-2 hover:text-on-surface transition-colors">
            Skip
        </button>
<button class="bg-primary-container text-on-primary-container font-label-bold text-label-bold h-14 px-12 rounded-full action-glow-gold active:scale-95 transition-transform duration-150">
            Continue
        </button>
</footer>
<!-- Interactive script for visual feedback -->
<script>
        const cards = document.querySelectorAll('main button');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => {
                    c.classList.remove('bg-primary-container', 'border-primary-container', 'scale-[1.02]', 'shadow-md');
                    c.classList.add('bg-surface-container-lowest', 'border-outline-variant');
                    
                    const texts = c.querySelectorAll('h3, p, span');
                    texts.forEach(t => {
                        if(t.tagName === 'SPAN') {
                            t.classList.remove('text-on-primary-container');
                            t.classList.add('text-secondary');
                        } else if(t.tagName === 'H3') {
                            t.classList.remove('text-on-primary-container');
                            t.classList.add('text-on-surface');
                        } else if(t.tagName === 'P') {
                            t.classList.remove('text-on-primary-container/80');
                            t.classList.add('text-on-surface-variant');
                        }
                    });
                });

                card.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
                card.classList.add('bg-primary-container', 'border-primary-container', 'scale-[1.02]', 'shadow-md');
                
                const activeTexts = card.querySelectorAll('h3, p, span');
                activeTexts.forEach(t => {
                    if(t.tagName === 'SPAN') {
                        t.classList.remove('text-secondary');
                        t.classList.add('text-on-primary-container');
                    } else if(t.tagName === 'H3') {
                        t.classList.remove('text-on-surface');
                        t.classList.add('text-on-primary-container');
                    } else if(t.tagName === 'P') {
                        t.classList.remove('text-on-surface-variant');
                        t.classList.add('text-on-primary-container/80');
                    }
                });
            });
        });
    </script>
</body></html>
