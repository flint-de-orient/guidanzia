                    "on-secondary-fixed": "#151f00",
                    "on-background": "#dbe1ff",
                    "tertiary": "#6efcfc",
                    "surface-container-low": "#131b32",
                    "inverse-surface": "#dbe1ff",
                    "secondary-container": "#89b100",
                    "on-tertiary-container": "#006060",
                    "on-secondary-fixed-variant": "#3a4d00",
                    "error": "#ffb4ab",

                    "surface-container-lowest": "#050d24",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation / Progress -->
<header class="flex flex-col w-full sticky top-0 z-50 bg-background">
<div class="flex items-center w-full px-margin-mobile h-16 justify-between">
<span class="material-symbols-outlined text-primary cursor-pointer transition-opacity duration-200 hover:opacity-80" data-icon="close">close</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">Question 06 of 12</span>
<div class="w-6 h-6"></div> <!-- Spacer for symmetry -->
</div>
<!-- Progress Rail -->
<div class="flex w-full gap-1 px-margin-mobile pb-4">
<div class="h-1 flex-1 bg-secondary rounded-full"></div>
<div class="h-1 flex-1 bg-secondary rounded-full"></div>
<div class="h-1 flex-1 bg-secondary rounded-full"></div>
<div class="h-1 flex-1 bg-secondary rounded-full"></div>
<div class="h-1 flex-1 bg-secondary rounded-full"></div>
<div class="h-1 flex-1 bg-secondary rounded-full"></div> <!-- 6th tick lime -->
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-stack-md pb-40">
<!-- Question Title -->
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-stack-lg">
            Which of these team environments feels most productive to you?
        </h1>
<!-- Option Zone (Grid of cards) -->
<div class="grid grid-cols-1 gap-stack-md">
<!-- Option 1 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Independent Mastery</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">Working solo on deep-focus tasks with minimal interruption.</p>
</button>
<!-- Option 2 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Collaborative Sprints</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">High-energy brainstorms and frequent peer feedback loops.</p>
</button>
<!-- Option 3 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Structured Hierarchy</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">Clear directives and established protocols for all workflows.</p>
</button>
<!-- Option 4 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Remote Flexibility</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">Asynchronous communication across global timezones.</p>
</button>
<!-- Option 5 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Rapid Prototyping</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">Building, breaking, and iterating at maximum velocity.</p>
</button>
<!-- Option 6 -->
<button class="bg-surface-container border-2 border-surface-variant p-stack-md rounded-lg text-left transition-all duration-150 hover:border-primary group">
<span class="font-label-bold text-label-bold text-tertiary block mb-1">Mission-Driven Elite</span>
<p class="font-body-md text-on-surface-variant group-hover:text-on-surface">Small, elite groups working on high-stakes problem solving.</p>
</button>
</div>
</main>
<!-- Error & Bottom Navigation Shell -->
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col">
<!-- Inline Error State (Amber hairline + Message) -->
<div class="bg-background/95 backdrop-blur-sm pt-4 animate-bounce">
<div class="border-t-2 border-primary-fixed-dim/40 w-full mb-3"></div>
<div class="px-margin-mobile flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary-fixed-dim scale-75" data-icon="warning">warning</span>
<p class="font-label-bold text-label-bold text-primary-fixed-dim">Please select an option to continue</p>
</div>
</div>
<!-- Action Bar -->
<div class="bg-surface-container/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-6 border-t-2 border-surface-variant">
<!-- Back Button -->
<button class="text-on-surface-variant flex items-center justify-center p-stack-sm hover:scale-105 transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary" data-icon="chevron_left">chevron_left</span>
</button>
<!-- Disabled Continue CTA -->
<button class="bg-primary/20 text-on-surface-variant/40 rounded-full px-12 h-14 flex items-center justify-center font-label-bold text-label-bold cursor-not-allowed opacity-50">
                Continue
            </button>
</div>
</div>
<!-- Background Decorative Element (Dark Navy / Subtle Noise) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<!-- Structural Line -->
<div class="absolute top-1/4 left-0 w-full h-[2px] bg-surface-variant/10 rotate-12"></div>
<div class="absolute bottom-1/4 right-0 w-full h-[2px] bg-secondary/5 -rotate-6"></div>
</div>
<script>
        // Simple interactivity for the cards (selecting them hides the error)
        const cards = document.querySelectorAll('button.bg-surface-container');
        const errorBar = document.querySelector('.animate-bounce');
        const continueBtn = document.querySelector('.bg-primary\\/20');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Reset others
                cards.forEach(c => {
                    c.classList.remove('border-primary', 'bg-surface-container-high');
                    c.classList.add('border-surface-variant', 'bg-surface-container');
                });
                
                // Select this one
                card.classList.remove('border-surface-variant', 'bg-surface-container');
                card.classList.add('border-primary', 'bg-surface-container-high');

                // Update UI state
                errorBar.classList.add('hidden');
                continueBtn.classList.remove('bg-primary/20', 'text-on-surface-variant/40', 'cursor-not-allowed', 'opacity-50');
                continueBtn.classList.add('bg-primary', 'text-on-primary', 'primary-glow');
                continueBtn.innerHTML = 'Continue';
            });
        });
    </script>
</body></html>
