</div>

<button class="w-full max-w-sm font-label-bold text-label-bold text-outline py-4 hover:text-on-surface transition-colors">
            I'd rather skip this
        </button>
</footer>
<script>
        // Puzzle Logic
        const grid = document.getElementById('puzzle-grid');
        const moveDisplay = document.getElementById('move-count');
        const timerDisplay = document.getElementById('timer');
        
        let moves = 0;
        let seconds = 45;
        let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];

        function shuffleTiles() {
            tiles = [1, 2, 3, 4, 5, 6, 7, null, 8];
            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';
            tiles.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                if (tile === null) {
                    tileDiv.className = 'bg-transparent aspect-square cursor-default';
                } else {
                    tileDiv.className = 'bg-surface-container-lowest border-2 border-primary-container rounded-[24px] shadow-sm flex items-center justify-center aspect-square cursor-pointer active:scale-95 transition-all action-glow-gold';
                    tileDiv.innerHTML = `<span class="font-display-lg text-on-surface text-[32px]">${tile}</span>`;
                    tileDiv.onclick = () => tryMove(index);
                }
                grid.appendChild(tileDiv);
            });
        }

        function tryMove(index) {
            const emptyIndex = tiles.indexOf(null);
            const row = Math.floor(index / 3);
            const col = index % 3;
            const emptyRow = Math.floor(emptyIndex / 3);
            const emptyCol = emptyIndex % 3;

            const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

            if (isAdjacent) {
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                moves++;
                moveDisplay.textContent = moves;
                renderGrid();
                checkWin();
            }
        }

        function checkWin() {
            const winCondition = [1, 2, 3, 4, 5, 6, 7, 8, null];
            const isWin = tiles.every((val, index) => val === winCondition[index]);
            if (isWin) {
                moveDisplay.classList.add('text-primary');
                timerDisplay.classList.add('text-primary');
            }
        }

        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }, 1000);

        shuffleTiles();
    </script>
