<div class="fixed bottom-0 -left-20 w-80 h-80 bg-primary/5 blur-[100px] rounded-full pointer-events-none -z-10"></div>
<script>
        // Simple micro-interaction for option selection (mocked behavior)
        document.querySelectorAll('button[class*="bg-surface-container"]').forEach(button => {
            button.addEventListener('click', () => {
                // Clear all previous selections
                document.querySelectorAll('button[class*="bg-surface-container"]').forEach(btn => {
                    btn.classList.remove('border-secondary', 'bg-surface-container-high');
                    btn.classList.add('border-outline-variant', 'bg-surface-container');
                    btn.querySelector('div').classList.remove('bg-secondary', 'border-secondary');
                    btn.querySelector('div').innerHTML = '';
                });

                // Set active state
                button.classList.remove('border-outline-variant', 'bg-surface-container');
                button.classList.add('border-secondary', 'bg-surface-container-high');
                const radio = button.querySelector('div');
                radio.classList.add('bg-secondary', 'border-secondary');
                radio.innerHTML = '<span class="material-symbols-outlined text-on-secondary" style="font-size: 16px; font-weight: bold;">check</span>';

                // Hide error and enable button (UX logic simulation)
                const errorDiv = document.querySelector('.border-t-2.border-primary-fixed-dim\\/50').parentElement;
                errorDiv.style.display = 'none';
                const continueBtn = document.querySelector('button[disabled]');
                if(continueBtn) {
                    continueBtn.removeAttribute('disabled');
                    continueBtn.classList.remove('glow-btn-disabled');
                    continueBtn.style.boxShadow = '0 0 20px rgba(240, 192, 77, 0.4)';
                }
            });
        });
    </script>
