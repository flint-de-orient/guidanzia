<div class="absolute bottom-[20%] right-[-10%] w-[350px] h-[350px] bg-secondary-fixed-dim rounded-full blur-[100px]"></div>
</div>
<script>
        const pills = document.querySelectorAll('.subject-pill');
        const hintText = document.getElementById('hint-text');
        const continueBtn = document.getElementById('continue-btn');
        const errorMsg = document.getElementById('error-message');
        
        let ranking = []; // Stores subject names in order

        const RANK_CONFIG = {
            1: { class: 'rank-1-active', color: '#785a00' },
            2: { class: 'rank-2-active', color: '#4f6700' },
            3: { class: 'rank-3-active', color: '#006a6a' }
        };

        function updateUI() {
            // Reset all pills first
            pills.forEach(pill => {
                pill.className = "subject-pill group bg-surface-container-lowest border-2 border-outline-variant/20 rounded-xl p-4 flex items-center gap-3 transition-all duration-300 cursor-pointer hover:border-primary/30 min-h-[72px] shadow-sm";
                const badge = pill.querySelector('.badge');
                badge.classList.remove('bg-primary', 'bg-secondary', 'bg-tertiary');
                badge.innerText = '';
                pill.querySelector('.title').classList.remove('text-on-primary', 'text-on-secondary', 'text-on-tertiary');
                pill.querySelector('.title').classList.add('text-on-surface');
            });

            // Apply ranking styles
            ranking.forEach((name, index) => {
                const pill = Array.from(pills).find(p => p.dataset.subject === name);
                const rank = index + 1;
                const config = RANK_CONFIG[rank];

                if (pill) {
                    pill.classList.add(config.class);
                    const badge = pill.querySelector('.badge');
                    badge.innerText = rank;
                }
            });

            // Update Hint Bar
            if (ranking.length === 0) {
                hintText.innerHTML = '<span class="opacity-40">1st: ___ · 2nd: ___ · 3rd: ___</span>';
            } else {
                let html = '';
                ranking.forEach((name, i) => {
                    const color = RANK_CONFIG[i+1].color;
                    html += `<span style="color: ${color}">${name}</span>`;
                    if (i < ranking.length - 1) html += '<span class="text-on-surface-variant/40 mx-2">→</span>';
                });
                hintText.innerHTML = html;
            }

            // Update Continue Button State
            if (ranking.length === 3) {
                continueBtn.disabled = false;
            } else {
                continueBtn.disabled = true;
            }

            // Hide error if requirements met
            if (ranking.length === 3) {
                hideError();
            }
        }

        function showError() {
            errorMsg.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            errorMsg.classList.add('opacity-100', 'translate-y-0');
            setTimeout(hideError, 3000);
        }

        function hideError() {
            errorMsg.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            errorMsg.classList.remove('opacity-100', 'translate-y-0');
        }

        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                const subjectName = pill.dataset.subject;
                const index = ranking.indexOf(subjectName);

                if (index > -1) {
                    // Deselect and re-rank
                    ranking.splice(index, 1);
                } else {
                    // Select if room
                    if (ranking.length < 3) {
                        ranking.push(subjectName);
                    }
                }
                updateUI();
            });
        });

        continueBtn.addEventListener('click', () => {
            if (ranking.length < 3) {
                showError();
            } else {
                console.log("Proceeding with: ", ranking);
            }
        });

        // Initialize
        updateUI();
    </script>
