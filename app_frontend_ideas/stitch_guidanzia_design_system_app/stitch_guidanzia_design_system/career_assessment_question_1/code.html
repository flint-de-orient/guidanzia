<style>
    body {

<body class="bg-background flex flex-col min-h-screen text-on-background">
<!-- Sticky Top Header (Progress Bar) -->
<header class="sticky top-0 z-50 bg-background/95 backdrop-blur-sm pt-8 pb-4 px-margin-mobile">
<div class="flex items-center justify-between gap-4">
<!-- Progress Bar: 20 ticks -->
<div class="flex items-end gap-1 flex-1 h-6">
<!-- Ticks 1-4: Filled Gold -->
<div class="w-1 h-3 rounded-full bg-primary-container"></div>
<div class="w-1 h-3 rounded-full bg-primary-container"></div>
<div class="w-1 h-3 rounded-full bg-primary-container"></div>
<div class="w-1 h-3 rounded-full bg-primary-container"></div>
<!-- Tick 5: Current (Acid Lime & Taller) -->
<div class="w-1 h-5 rounded-full bg-secondary"></div>
<!-- Ticks 6-20: Muted Navy Hairline -->
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
<div class="w-1 h-3 rounded-full bg-[#243056]"></div>
</div>
<!-- Module Text -->
<span class="font-label-bold text-label-bold text-[#8E9BC4] whitespace-nowrap">Module 2 of 6</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-8 pb-32">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-[#F4F6FF] mb-stack-lg leading-tight">
            Which environment helps you do your best work?
        </h1>
<!-- Answer Options -->
<div class="flex flex-col gap-4">
<!-- Card 1 (Selected) -->
<button class="w-full bg-primary-container border-2 border-primary-container rounded-[24px] p-6 text-left flex gap-4 transition-all scale-[1.02] duration-300">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-[#0A1229]" style="font-size: 28px;">hub</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-[#0A1229] mb-1">Collaborative Studio</h3>
<p class="font-body-md text-body-md text-[#0A1229]/80">High-energy brainstorming with a team.</p>
</div>
</button>
<!-- Card 2 -->
<button class="w-full bg-surface-container-low border-2 border-[#243056] rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">laptop</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Quiet Focus</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Deep work in a peaceful, solo space.</p>
</div>
</button>
<!-- Card 3 -->
<button class="w-full bg-surface-container-low border-2 border-[#243056] rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">groups</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Client Facing</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Presenting ideas and managing relationships.</p>
</div>
</button>
<!-- Card 4 -->
<button class="w-full bg-surface-container-low border-2 border-[#243056] rounded-[24px] p-6 text-left flex gap-4 hover:border-secondary transition-colors duration-200">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-size: 28px;">science</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">The Lab</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Testing, experimenting, and refining.</p>
</div>
</button>
</div>
</main>
<!-- Bottom Actions -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile flex items-center justify-between bg-gradient-to-t from-background via-background to-transparent pt-12 pb-8 z-50">
<button class="font-label-bold text-label-bold text-[#8E9BC4] px-4 py-2 hover:text-white transition-colors">
            Skip
        </button>
<button class="bg-primary-container text-[#0A1229] font-label-bold text-label-bold h-14 px-12 rounded-full action-glow-gold active:scale-95 transition-transform duration-150">
            Continue
        </button>
</footer>
<!-- Interactive script for visual feedback -->
<script>
        const cards = document.querySelectorAll('main button');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => {
                    c.classList.remove('bg-primary-container', 'border-primary-container', 'scale-[1.02]');
                    c.classList.add('bg-surface-container-low', 'border-[#243056]');
                    
                    const texts = c.querySelectorAll('h3, p, span');
                    texts.forEach(t => {
                        if(t.tagName === 'SPAN') {
                            t.classList.remove('text-[#0A1229]');
                            t.classList.add('text-secondary');
                        } else if(t.tagName === 'H3') {
                            t.classList.remove('text-[#0A1229]');
                            t.classList.add('text-on-surface');
                        } else if(t.tagName === 'P') {
                            t.classList.remove('text-[#0A1229]/80');
                            t.classList.add('text-on-surface-variant');
                        }
                    });
                });

                card.classList.remove('bg-surface-container-low', 'border-[#243056]');
                card.classList.add('bg-primary-container', 'border-primary-container', 'scale-[1.02]');
                
                const activeTexts = card.querySelectorAll('h3, p, span');
                activeTexts.forEach(t => {
                    if(t.tagName === 'SPAN') {
                        t.classList.remove('text-secondary');
                        t.classList.add('text-[#0A1229]');
                    } else if(t.tagName === 'H3') {
                        t.classList.remove('text-on-surface');
                        t.classList.add('text-[#0A1229]');
                    } else if(t.tagName === 'P') {
                        t.classList.remove('text-on-surface-variant');
                        t.classList.add('text-[#0A1229]/80');
                    }
                });
            });
        });
    </script>
