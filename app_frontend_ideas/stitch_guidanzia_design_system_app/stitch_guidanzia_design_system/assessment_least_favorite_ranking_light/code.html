<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .rank-badge-1 { background-color: #785a00; color: #ffffff; }
        .rank-badge-2 { background-color: #4f6700; color: #ffffff; }
        .active-glow { box-shadow: 0 10px 30px rgba(120, 90, 0, 0.1); }
        .glass-nav { backdrop-filter: blur(20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation / Progress Shell -->
<header class="w-full top-0 sticky z-30 bg-background pt-6 px-margin-mobile pb-4">
<div class="flex flex-col gap-4">
<!-- Progress Rail: 20 Ticks -->
<div class="flex items-end justify-between gap-1 h-6">
<!-- Completed Ticks (1-3) -->
<div class="flex-1 h-1 bg-primary-fixed rounded-full"></div>
<div class="flex-1 h-1 bg-primary-fixed rounded-full"></div>
<div class="flex-1 h-1 bg-primary-fixed rounded-full"></div>
<!-- Current Tick (4) -->
<div class="flex-1 h-3 bg-primary rounded-full transition-all duration-300"></div>
<!-- Remaining Ticks (5-20) -->
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-full"></div>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-wider uppercase">Module 6 · Question 4 of 20</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Rank your top 2 least favorite subjects.</h1>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pb-32">
<!-- Persistent Hint Line -->
<div class="mt-stack-md py-3 px-4 bg-surface-container-lowest border-2 border-outline-variant rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-size: 18px;">info</span>
<p class="font-body-md text-on-surface-variant">
                1st: <span class="text-primary font-bold" id="rank-1-label">___</span>  ·  
                2nd: <span class="text-secondary font-bold" id="rank-2-label">___</span>
</p>
</div>
<!-- Options Zone -->
<div class="mt-stack-md flex flex-col gap-4">
<!-- Subject Card: Mathematics -->
<button class="subject-card group w-full p-5 flex justify-between items-center bg-surface-container-lowest border-2 border-outline-variant rounded-xl transition-all duration-200 active:scale-[0.98] hover:border-outline" onclick="toggleRank('Mathematics', this)">
<span class="font-headline-sm text-headline-sm text-on-surface">Mathematics</span>
<div class="rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-colors"></div>
</button>
<!-- Subject Card: Physics -->
<button class="subject-card group w-full p-5 flex justify-between items-center bg-surface-container-lowest border-2 border-outline-variant rounded-xl transition-all duration-200 active:scale-[0.98] hover:border-outline" onclick="toggleRank('Physics', this)">
<span class="font-headline-sm text-headline-sm text-on-surface">Physics</span>
<div class="rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-colors"></div>
</button>
<!-- Subject Card: Chemistry -->
<button class="subject-card group w-full p-5 flex justify-between items-center bg-surface-container-lowest border-2 border-outline-variant rounded-xl transition-all duration-200 active:scale-[0.98] hover:border-outline" onclick="toggleRank('Chemistry', this)">
<span class="font-headline-sm text-headline-sm text-on-surface">Chemistry</span>
<div class="rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-colors"></div>
</button>
<!-- Subject Card: Biology -->
<button class="subject-card group w-full p-5 flex justify-between items-center bg-surface-container-lowest border-2 border-outline-variant rounded-xl transition-all duration-200 active:scale-[0.98] hover:border-outline" onclick="toggleRank('Biology', this)">
<span class="font-headline-sm text-headline-sm text-on-surface">Biology</span>
<div class="rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-colors"></div>
</button>
<!-- Subject Card: Economics -->
<button class="subject-card group w-full p-5 flex justify-between items-center bg-surface-container-lowest border-2 border-outline-variant rounded-xl transition-all duration-200 active:scale-[0.98] hover:border-outline" onclick="toggleRank('Economics', this)">
<span class="font-headline-sm text-headline-sm text-on-surface">Economics</span>
<div class="rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-colors"></div>
</button>
</div>
</main>
<!-- Error Message Anchor -->
<div class="fixed bottom-[88px] left-0 w-full px-margin-mobile py-3 bg-surface z-40">
<div class="flex items-center gap-2 border-l-4 border-primary px-3 py-2 bg-primary/5 rounded-r-md">
<span class="material-symbols-outlined text-primary text-[20px]">warning</span>
<span class="font-label-bold text-label-bold text-primary">Please select your top 2 to continue</span>
</div>
</div>
<!-- Bottom Action Bar Shell -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile pb-6 pt-4 bg-surface-container-lowest/80 backdrop-blur-xl border-t-2 border-outline-variant">
<!-- Back Button (Ghost) -->
<button class="flex items-center gap-2 text-on-surface-variant font-label-bold hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
<span class="font-label-bold text-label-bold">Back</span>
</button>
<!-- Continue Button (Primary Pill, Disabled State) -->
<button class="opacity-40 grayscale pointer-events-none bg-primary text-on-primary rounded-full px-8 py-3 flex items-center gap-2 font-label-bold text-label-bold active:scale-95 transition-all duration-200 shadow-none" disabled="" id="continue-btn">
<span class="font-label-bold text-label-bold">Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<script>
        let selection = [];

        function toggleRank(subject, el) {
            const index = selection.indexOf(subject);
            const indicator = el.querySelector('.rank-indicator');
            const errorBar = document.querySelector('.fixed.bottom-\\[88px\\]');
            const continueBtn = document.getElementById('continue-btn');

            if (index > -1) {
                // Remove selection
                selection.splice(index, 1);
            } else {
                // Add selection if limit not reached
                if (selection.length < 2) {
                    selection.push(subject);
                } else {
                    return;
                }
            }

            // Update UI for all cards based on selection array
            document.querySelectorAll('.subject-card').forEach(card => {
                const cardSubject = card.querySelector('span').innerText;
                const cardIndicator = card.querySelector('.rank-indicator');
                const cardIndex = selection.indexOf(cardSubject);

                card.classList.remove('border-primary', 'border-secondary', 'active-glow', 'bg-primary/5', 'bg-secondary/5');
                cardIndicator.innerHTML = '';
                cardIndicator.className = 'rank-indicator w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border-2 border-outline-variant transition-all';

                if (cardIndex === 0) {
                    card.classList.add('border-primary', 'active-glow', 'bg-primary/5');
                    cardIndicator.innerText = '1';
                    cardIndicator.classList.add('rank-badge-1', 'border-primary');
                } else if (cardIndex === 1) {
                    card.classList.add('border-secondary', 'bg-secondary/5');
                    cardIndicator.innerText = '2';
                    cardIndicator.classList.add('rank-badge-2', 'border-secondary');
                }
            });

            // Update Hint Labels
            document.getElementById('rank-1-label').innerText = selection[0] || '___';
            document.getElementById('rank-2-label').innerText = selection[1] || '___';

            // Handle Error & Continue Button State
            if (selection.length === 2) {
                errorBar.classList.add('hidden');
                continueBtn.disabled = false;
                continueBtn.classList.remove('opacity-40', 'grayscale', 'pointer-events-none');
                continueBtn.classList.add('shadow-[0_10px_20px_rgba(120,90,0,0.2)]');
            } else {
                errorBar.classList.remove('hidden');
                continueBtn.disabled = true;
                continueBtn.classList.add('opacity-40', 'grayscale', 'pointer-events-none');
                continueBtn.classList.remove('shadow-[0_10px_20px_rgba(120,90,0,0.2)]');
            }
        }
    </script>
</body></html>
