<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia | Insight Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-effect {
            position: relative;
            overflow: hidden;
            background-color: #ebedff; /* surface-container */
        }
        .shimmer-effect::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(171, 213, 51, 0.2),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }
        .radial-glow {
            background: radial-gradient(circle at center, rgba(171, 213, 51, 0.1) 0%, rgba(252, 248, 253, 0) 70%);
        }
        .progress-indeterminate {
            width: 30%;
            height: 100%;
            background-color: #abd533; /* secondary / lime accent */
            animation: indeterminate 2s infinite ease-in-out;
        }
        @keyframes indeterminate {
            0% { left: -30%; }
            100% { left: 100%; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#dbe1ff",
                      "tertiary-container": "#4bdfdf",
                      "outline": "#807663",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-container": "#546d00",
                      "surface-container-low": "#f2f3ff",
                      "primary": "#785a00", /* Graduation Gold */
                      "surface-container-high": "#e3e7ff",
                      "tertiary-fixed": "#69f7f7",
                      "on-primary-fixed": "#251a00",
                      "on-background": "#0b0a3d", /* Deep Navy */
                      "surface-container-highest": "#dbe1ff",
                      "secondary-fixed-dim": "#abd533",
                      "on-tertiary-container": "#006060",
                      "on-primary-fixed-variant": "#5b4300",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#c6f24e",
                      "surface-tint": "#785a00",
                      "surface": "#fcf8fd", /* Cloud White */
                      "inverse-on-surface": "#eff0ff",
                      "tertiary": "#006a6a",
                      "on-secondary-fixed": "#151f00",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#f0c04d",
                      "on-surface-variant": "#4e4635",
                      "primary-container": "#f5c451",
                      "secondary": "#abd533", /* Lime Accent */
                      "inverse-surface": "#282f48",
                      "surface-dim": "#d2d9f9",
                      "on-primary-container": "#6d5100",
                      "primary-fixed": "#ffdf9d",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#3a4d00",
                      "tertiary-fixed-dim": "#45dada",
                      "on-tertiary-fixed": "#002020",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed-variant": "#004f50",
                      "surface-bright": "#faf8ff",
                      "inverse-primary": "#f0c04d",
                      "on-error-container": "#93000a",
                      "surface-container": "#ebedff",
                      "background": "#fcf8fd", /* Cloud White */
                      "on-surface": "#0b0a3d", /* Deep Navy */
                      "secondary-container": "#c6f24e",
                      "outline-variant": "#d2c5b0"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "stack-sm": "8px",
                      "stack-lg": "48px",
                      "margin-mobile": "20px",
                      "unit": "4px",
                      "stack-md": "24px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "label-bold": ["Hanken Grotesk"],
                      "body-md": ["Be Vietnam Pro"],
                      "body-lg": ["Be Vietnam Pro"],
                      "headline-sm": ["Sora"],
                      "display-xl": ["Sora"],
                      "display-lg-mobile": ["Sora"],
                      "headline-md": ["Sora"],
                      "headline-md-mobile": ["Sora"],
                      "display-lg": ["Sora"]
              },
              "fontSize": {
                      "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                      "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                      "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                      "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}]
              }
            },
          },
        }
      </script>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Subtle Radial Glow Layer -->
<div class="fixed inset-0 radial-glow pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-margin-mobile">
<!-- Center-aligned Container -->
<div class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Outlined Numeral "2" -->
<div class="flex items-center justify-center">
<span class="font-display-xl text-display-xl text-transparent" style="-webkit-text-stroke: 2px #abd533; opacity: 1;">
                    2
                </span>
</div>
<!-- Headline -->
<div class="space-y-stack-md w-full">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface tracking-tight">
                    Here's what we're seeing
                </h1>
<!-- Shimmering Skeleton Lines -->
<div class="space-y-4 w-full">
<div class="h-4 w-full rounded-full shimmer-effect border border-outline-variant/40"></div>
<div class="h-4 w-[92%] mx-auto rounded-full shimmer-effect border border-outline-variant/40"></div>
<div class="h-4 w-[75%] mx-auto rounded-full shimmer-effect border border-outline-variant/40"></div>
</div>
<!-- Indeterminate Progress Bar -->
<div class="relative w-full h-1 bg-surface-container rounded-full overflow-hidden mt-stack-md border border-outline-variant/20">
<div class="progress-indeterminate absolute top-0"></div>
</div>
</div>
</div>
</main>
<!-- Bottom-anchored Action (Disabled State) -->
<footer class="relative z-10 p-margin-mobile flex justify-center pb-12">
<button class="w-full max-w-md h-[56px] rounded-full bg-on-surface/5 text-on-surface/30 font-label-bold text-label-bold flex items-center justify-center cursor-not-allowed border border-outline-variant" disabled="">
            Keep going
        </button>
</footer>
<!-- Background Atmospheric Effect -->
<script>
        // Subtle drift for the radial glow
        const glow = document.querySelector('.radial-glow');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(171, 213, 51, 0.1) 0%, rgba(252, 248, 253, 0) 70%)`;
        });
    </script>
</body></html>
