<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia - Insight Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#171f36",
                    "on-secondary-container": "#2f3f00",
                    "on-surface": "#dbe1ff",
                    "on-primary-fixed-variant": "#5b4300",
                    "primary-fixed-dim": "#f0c04d",
                    "on-primary-container": "#6d5100",
                    "inverse-surface": "#dbe1ff",
                    "error": "#ffb4ab",
                    "inverse-primary": "#785a00",
                    "primary-fixed": "#ffdf9d",
                    "surface-container-highest": "#2c344c",
                    "on-error-container": "#ffdad6",
                    "tertiary-fixed": "#69f7f7",
                    "tertiary-container": "#4bdfdf",
                    "outline-variant": "#4e4635",
                    "tertiary-fixed-dim": "#45dada",
                    "on-tertiary": "#003737",
                    "secondary": "#abd533",
                    "primary": "#ffe4af",
                    "error-container": "#93000a",
                    "on-secondary-fixed": "#151f00",
                    "on-surface-variant": "#d2c5b0",
                    "surface-container-high": "#222941",
                    "on-primary-fixed": "#251a00",
                    "secondary-fixed": "#c6f24e",
                    "surface": "#0a1229",
                    "surface-bright": "#313851",
                    "on-secondary": "#273500",
                    "on-tertiary-fixed": "#002020",
                    "on-secondary-fixed-variant": "#3a4d00",
                    "inverse-on-surface": "#282f48",
                    "on-tertiary-fixed-variant": "#004f50",
                    "outline": "#9b8f7c",
                    "secondary-container": "#89b100",
                    "on-background": "#dbe1ff",
                    "on-error": "#690005",
                    "primary-container": "#f5c451",
                    "surface-variant": "#2c344c",
                    "secondary-fixed-dim": "#abd533",
                    "surface-tint": "#f0c04d",
                    "on-primary": "#3f2e00",
                    "on-tertiary-container": "#006060",
                    "tertiary": "#6efcfc",
                    "surface-container-lowest": "#050d24",
                    "background": "#0a1229",
                    "surface-dim": "#0a1229",
                    "surface-container-low": "#131b32"

            "borderRadius": {

                    "margin-mobile": "20px",

                    "stack-md": "24px",

            "fontFamily": {

                    "body-md": ["Be Vietnam Pro"],

                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}]

<style>
        body {
            background-color: #0a1229;
            color: #dbe1ff;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .acid-glow {
            background: radial-gradient(circle at center, rgba(171, 213, 51, 0.15) 0%, rgba(10, 18, 41, 0) 70%);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .numeral-outline {
            -webkit-text-stroke: 2px #ffe4af;
            color: transparent;
        }

        .button-glow {
            box-shadow: 0 0 20px rgba(240, 192, 77, 0.4);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .transition-active:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen">
<!-- Insight Card Canvas -->
<main class="relative w-full max-w-md h-screen flex flex-col items-center justify-between px-margin-mobile py-12 overflow-hidden bg-background">
<!-- Background Radial Glow -->
<div class="acid-glow"></div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center text-center flex-grow space-y-stack-lg">
<!-- 1. Outlined Numeral -->
<div class="flex flex-col items-center">
<span class="numeral-outline font-display-xl text-display-xl leading-none block" style="font-size: 72px;">
                    2
                </span>
<span class="font-label-bold text-label-bold text-secondary uppercase tracking-widest mt-2">
                    Module Complete
                </span>
</div>
<!-- 2. Headline & Observation -->
<div class="space-y-stack-md">
<h1 class="font-headline-md text-headline-md text-primary px-4">
                    Here's what we're seeing
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto leading-relaxed">
                    You show a strong preference for <span class="text-secondary font-semibold">collaborative problem-solving</span> and structured environments. Your analytical skills seem to shine when working on digital-first challenges.
                </p>
</div>
<!-- 3. Feature Chips -->
<div class="flex flex-row flex-wrap justify-center gap-stack-sm">
<span class="bg-surface-container-highest border-2 border-outline-variant px-4 py-2 rounded-xl font-label-bold text-label-bold text-tertiary">
                    Creative
                </span>
<span class="bg-surface-container-highest border-2 border-outline-variant px-4 py-2 rounded-xl font-label-bold text-label-bold text-tertiary">
                    Analytical
                </span>
<span class="bg-surface-container-highest border-2 border-outline-variant px-4 py-2 rounded-xl font-label-bold text-label-bold text-tertiary">
                    Collaborative
                </span>
</div>
</div>
<!-- Bottom-anchored Button -->
<div class="relative z-10 w-full px-margin-mobile pb-8">
<button class="w-full h-14 bg-primary-container text-on-primary font-label-bold text-body-lg rounded-full flex items-center justify-center gap-2 button-glow transition-all transition-active hover:brightness-110 active:opacity-90">
                Keep going
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const numeral = document.querySelector('.numeral-outline');
            const chips = document.querySelectorAll('.bg-surface-container-highest');
            
            // Subtle entrance animation
            numeral.animate([
                { transform: 'scale(0.8)', opacity: 0 },
                { transform: 'scale(1)', opacity: 1 }
            ], {
                duration: 800,
                easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
            });

            chips.forEach((chip, index) => {
                chip.animate([
                    { transform: 'translateY(10px)', opacity: 0 },
                    { transform: 'translateY(0)', opacity: 1 }
                ], {
                    duration: 600,
                    delay: 400 + (index * 100),
                    fill: 'forwards',
                    easing: 'ease-out'
                });
            });
        });
    </script>
</body></html>
