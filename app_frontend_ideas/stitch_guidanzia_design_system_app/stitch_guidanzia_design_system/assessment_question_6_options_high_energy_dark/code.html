<!DOCTYPE html>

<html class="dark" lang="en"><head>

    .option-card.selected {

          "spacing": {

            "stack-xs": "4px",

            "stack-lg": "24px",
            "stack-sm": "8px",
            "stack-md": "16px",
            "container-margin": "24px",

          },
          "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen bg-[#0A1229]">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 border-b border-outline-variant bg-surface dark:bg-surface flex items-center justify-between px-gutter h-16">
<button class="flex items-center justify-center p-2 text-primary active:scale-95 duration-150 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary-container">Assessment</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Progress Rail -->
<div class="px-container-margin py-stack-md flex gap-1">
<!-- 6 Filled (Acid Lime) -->
<div class="progress-segment bg-[#C6F24E]"></div>
<div class="progress-segment bg-[#C6F24E]"></div>
<div class="progress-segment bg-[#C6F24E]"></div>
<div class="progress-segment bg-[#C6F24E]"></div>
<div class="progress-segment bg-[#C6F24E]"></div>
<div class="progress-segment bg-[#C6F24E]"></div>
<!-- 14 Unfilled -->
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
<div class="progress-segment bg-[#243056]"></div>
</div>
<main class="flex-grow flex flex-col px-container-margin pb-32">
<!-- Headline -->
<h2 class="mt-stack-lg font-headline-md text-headline-md text-[#F4F6FF] max-w-lg">
      Which of these team environments feels most productive to you?
    </h2>
<!-- Options Stack -->
<div class="mt-section-gap flex flex-col gap-stack-md">
<!-- Collaborative Studio -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Collaborative Studio</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Quiet Focus -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="self_care">self_care</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Quiet Focus</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Fast-Paced Startup -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="rocket_launch">rocket_launch</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Fast-Paced Startup</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Remote Autonomy -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="home_work">home_work</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Remote Autonomy</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Structured Agency -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="account_tree">account_tree</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Structured Agency</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Social Impact -->
<button class="option-card hairline-border bg-[#141F42] rounded-lg p-stack-md flex items-center gap-stack-md text-left transition-all hover:bg-surface-container-highest group" onclick="selectOption(this)">
<div class="bg-surface-container-low p-2 rounded-lg flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="volunteer_activism">volunteer_activism</span>
</div>
<span class="font-body-lg text-body-lg text-[#F4F6FF] flex-grow">Social Impact</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 w-full z-50 border-t border-outline-variant flex justify-between items-center px-container-margin py-stack-md w-full bg-surface-container-low">
<!-- Back Button -->
<button class="flex flex-row items-center justify-center text-on-surface-variant hover:opacity-90 active:scale-95 transition-transform">
<span class="material-symbols-outlined mr-1" data-icon="chevron_left">chevron_left</span>
<span class="font-label-md text-label-md">Back</span>
</button>
<!-- Continue Button (Disabled/Dimmed State) -->
<button class="flex flex-row items-center justify-center bg-primary-container/20 text-on-surface-variant/40 rounded-full px-stack-lg py-stack-sm cursor-not-allowed transition-all" disabled="" id="continue-btn">
<span class="font-label-md text-label-md mr-1">Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<script>
    function selectOption(element) {
      // Remove selection from all cards
      document.querySelectorAll('.option-card').forEach(card => {
        card.classList.remove('selected', 'border-primary-container');
        card.classList.add('hairline-border');
        const icon = card.querySelector('[data-icon="radio_button_checked"], [data-icon="radio_button_unchecked"]');
        if (icon) {
          icon.textContent = 'radio_button_unchecked';
          icon.setAttribute('data-icon', 'radio_button_unchecked');
          icon.classList.remove('text-primary');
          icon.classList.add('text-outline-variant');
        }
      });

      // Apply selection to clicked card
      element.classList.add('selected', 'border-primary-container');
      element.classList.remove('hairline-border');
      const icon = element.querySelector('[data-icon="radio_button_unchecked"]');
      if (icon) {
        icon.textContent = 'radio_button_checked';
        icon.setAttribute('data-icon', 'radio_button_checked');
        icon.classList.remove('text-outline-variant');
        icon.classList.add('text-primary');
      }

      // Enable Continue button
      const continueBtn = document.getElementById('continue-btn');
      continueBtn.disabled = false;
      continueBtn.classList.remove('bg-primary-container/20', 'text-on-surface-variant/40', 'cursor-not-allowed');
      continueBtn.classList.add('bg-primary-container', 'text-on-primary', 'active:scale-95');
    }
  </script>
</body></html>
