                            "surface-bright": "#141F42",
                            "inverse-primary": "#785a00",
                            "on-error-container": "#93000a",

                        },
                        "borderRadius": {

                        },
                        "spacing": {
                            "unit": "4px",
                            "gutter": "16px",

                            "stack-md": "24px",
                            "stack-sm": "8px",
                            "margin-desktop": "40px",
                            "stack-lg": "48px"
                        },
                        "fontFamily": {
                            "display-lg-mobile": ["Sora"],
                            "headline-sm": ["Sora"],

                            "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                            "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                            "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                            "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                            "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                            "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                        }
                    },
                },
            }
        } catch (_e) {}
    </script>
<style>
        .option-card.card-selected {
            border-color: #f5c451;
            background-color: rgba(245, 196, 81, 0.05);
            box-shadow: 0 4px 12px rgba(245, 196, 81, 0.15);
        }
        .active-icon {
            color: #f5c451 !important;
        }
        .btn-active {
            background-color: #f5c451 !important;
            opacity: 1 !important;
            cursor: pointer !important;
            color: #0A1229 !important;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Segmented Progress Rail -->
<div class="w-full flex items-end h-8 px-0 gap-[2px] bg-surface-container/30">
<!-- Ticks 1-5 (Completed) -->
<div class="flex-1 h-1 bg-primary"></div>
<div class="flex-1 h-1 bg-primary"></div>
<div class="flex-1 h-1 bg-primary"></div>
<div class="flex-1 h-1 bg-primary"></div>
<div class="flex-1 h-1 bg-primary"></div>
<!-- Tick 6 (Current) -->
<div class="flex-1 h-2.5 bg-primary shadow-[0_0_8px_rgba(198,242,78,0.4)]"></div>
<!-- Ticks 7-20 (Remaining) -->
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pt-stack-md pb-32">
<!-- Subtitle Context -->
<p class="text-on-surface-variant font-label-bold text-label-bold mb-4 uppercase tracking-wider">
            Module 3 · Question 6 of 20
        </p>
<!-- Question Title -->
<h1 class="text-[34px] leading-tight font-extrabold font-headline-md-mobile text-on-surface mb-stack-lg">
            Which of these tasks makes you lose track of time?
        </h1>
<!-- Options Cards Stack -->
<div class="flex flex-col gap-3">
<!-- Option 1 -->
<button class="option-card w-full h-[88px] flex items-center p-4 bg-surface-container-low border border-outline-variant/50 rounded-xl text-left transition-all active:scale-[0.98] group hover:border-primary-fixed/50" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-lg bg-surface-container border border-outline-variant/30 flex items-center justify-center mr-4 group-hover:bg-primary-fixed/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="code">code</span>
</div>
<div class="flex-1">
<p class="font-bold text-[17px] text-on-surface">Writing clean code</p>
<p class="text-[14px] text-on-surface-variant line-clamp-1">Solving logic puzzles and architecture.</p>
</div>
</button>
<!-- Option 2 -->
<button class="option-card w-full h-[88px] flex items-center p-4 bg-surface-container-low border border-outline-variant/50 rounded-xl text-left transition-all active:scale-[0.98] group hover:border-primary-fixed/50" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-lg bg-surface-container border border-outline-variant/30 flex items-center justify-center mr-4 group-hover:bg-primary-fixed/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="palette">palette</span>
</div>
<div class="flex-1">
<p class="font-bold text-[17px] text-on-surface">Visual storytelling</p>
<p class="text-[14px] text-on-surface-variant line-clamp-1">Designing layouts and crafting aesthetics.</p>
</div>
</button>
<!-- Option 3 -->
<button class="option-card w-full h-[88px] flex items-center p-4 bg-surface-container-low border border-outline-variant/50 rounded-xl text-left transition-all active:scale-[0.98] group hover:border-primary-fixed/50" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-lg bg-surface-container border border-outline-variant/30 flex items-center justify-center mr-4 group-hover:bg-primary-fixed/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="leaderboard">leaderboard</span>
</div>
<div class="flex-1">
<p class="font-bold text-[17px] text-on-surface">Analyzing data trends</p>
<p class="text-[14px] text-on-surface-variant line-clamp-1">Finding hidden patterns in complex sets.</p>
</div>
</button>
<!-- Option 4 -->
<button class="option-card w-full h-[88px] flex items-center p-4 bg-surface-container-low border border-outline-variant/50 rounded-xl text-left transition-all active:scale-[0.98] group hover:border-primary-fixed/50" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-lg bg-surface-container border border-outline-variant/30 flex items-center justify-center mr-4 group-hover:bg-primary-fixed/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="forum">forum</span>
</div>
<div class="flex-1">
<p class="font-bold text-[17px] text-on-surface">Leading a discussion</p>
<p class="text-[14px] text-on-surface-variant line-clamp-1">Negotiating and persuading a team.</p>
</div>
</button>
</div>
</main>
<!-- Bottom Anchored Action Bar -->
<nav class="fixed bottom-0 left-0 w-full p-margin-mobile flex items-center justify-between z-50 backdrop-blur-xl bg-surface/90 border-t border-outline-variant/20">
<!-- Back Action -->
<button class="w-14 h-14 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="chevron_left">chevron_left</span>
</button>
<!-- Continue CTA -->
<button class="flex-1 ml-4 h-[56px] rounded-full bg-on-surface-variant/10 text-on-surface/30 font-bold text-lg cursor-not-allowed transition-all duration-300" disabled="" id="continue-btn">
            Continue
        </button>
</nav>
<script>
        function selectOption(element) {
            // Clear previous selections
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('card-selected');
                card.querySelector('.material-symbols-outlined').classList.remove('active-icon');
            });

            // Set current selection
            element.classList.add('card-selected');
            element.querySelector('.material-symbols-outlined').classList.add('active-icon');

            // Enable Continue Button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            btn.classList.add('btn-active');
            btn.classList.remove('bg-on-surface-variant/10', 'text-on-surface/30', 'cursor-not-allowed');
            btn.classList.add('shadow-lg', 'shadow-primary-container/20');
        }
    </script>
</body></html>
