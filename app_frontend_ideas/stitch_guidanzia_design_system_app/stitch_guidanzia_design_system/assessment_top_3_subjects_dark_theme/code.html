<style>
        body {
            background-color: #0A1229; /* Explicit Brand Override */
            color: #F4F6FF;
            -webkit-font-smoothing: antialiased;
        }
        .bg-surface-custom { background-color: #141F42; }
        .border-outline-custom { border-color: #243056; }
        .text-muted-custom { color: #8E9BC4; }
        
        .progress-tick {
            width: 4px;
            height: 12px;
            border-radius: 1px;
            background-color: #243056;
            transition: all 0.3s ease;
        }
        .progress-tick.active {
            background-color: #C6F24E; /* Acid Lime */
            box-shadow: 0 0 10px rgba(198, 242, 78, 0.3);
        }

        .subject-card {
            background-color: #141F42;
            border: 1px solid #243056;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .subject-card:active {
            transform: scale(0.97);
        }
        .subject-card.selected {
            border-color: #F5C451;
            background-color: rgba(245, 196, 81, 0.05);
        }
        .selection-badge {
            display: none;
            width: 24px;
            height: 24px;
            border-radius: 9999px;
            background-color: #F5C451;
            color: #0A1229;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono';
            font-size: 12px;
            font-weight: 700;
        }
        .subject-card.selected .selection-badge {
            display: flex;
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>

            Back

<button class="flex items-center justify-center bg-primary-container/20 text-[#0A1229]/50 rounded-full px-lg py-sm font-bold font-label-caps text-label-caps opacity-50 cursor-not-allowed transition-all active:translate-y-0.5" disabled="" id="continue-btn">
            Continue
            <span class="material-symbols-outlined ml-xs" data-icon="chevron_right">chevron_right</span>
</button>

<script>
        let selections = [];

        function toggleSubject(element, subjectName) {
            const index = selections.indexOf(subjectName);
            
            if (index > -1) {
                // Remove selection
                selections.splice(index, 1);
                element.classList.remove('selected');
            } else {
                // Add selection if under limit
                if (selections.length < 3) {
                    selections.push(subjectName);
                    element.classList.add('selected');
                }
            }

            updateUI();
        }

        function updateUI() {
            // Update labels
            document.getElementById('rank-1').textContent = selections[0] || '___';
            document.getElementById('rank-2').textContent = selections[1] || '___';
            document.getElementById('rank-3').textContent = selections[2] || '___';

            // Update badge numbers in cards
            document.querySelectorAll('.subject-card').forEach(card => {
                const subject = card.querySelector('.text-headline-md').textContent;
                const selIndex = selections.indexOf(subject);
                const badge = card.querySelector('.selection-badge');
                if (selIndex > -1) {
                    badge.textContent = selIndex + 1;
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });

            // Update Continue Button State
            const btn = document.getElementById('continue-btn');
            if (selections.length === 3) {
                btn.disabled = false;
                btn.classList.remove('bg-primary-container/20', 'text-[#0A1229]/50', 'opacity-50', 'cursor-not-allowed');
                btn.classList.add('bg-primary-container', 'text-[#0A1229]', 'opacity-100', 'cursor-pointer');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-primary-container/20', 'text-[#0A1229]/50', 'opacity-50', 'cursor-not-allowed');
                btn.classList.remove('bg-primary-container', 'text-[#0A1229]', 'opacity-100', 'cursor-pointer');
            }
        }
    </script>
