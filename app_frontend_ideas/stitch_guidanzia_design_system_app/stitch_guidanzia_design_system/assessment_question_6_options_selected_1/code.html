<script>
        // Micro-interaction for card selection in light theme
        document.querySelectorAll('button.group.flex').forEach(button => {
            button.addEventListener('click', () => {
                // Find currently selected
                const currentSelected = document.querySelector('.bg-primary-container');
                if (currentSelected) {
                    // Reset current
                    currentSelected.classList.remove('bg-primary-container', 'border-primary-container', 'card-selected-glow', 'scale-[1.02]');
                    currentSelected.classList.add('bg-surface-container-lowest', 'border-surface-variant/30');
                    
                    const iconBox = currentSelected.querySelector('div');
                    iconBox.classList.remove('bg-on-surface', 'text-primary-container');
                    iconBox.classList.add('bg-surface-container', 'text-secondary');
                    
                    const checkIcon = currentSelected.querySelector('span.text-primary');
                    if (checkIcon && checkIcon.innerText === 'check_circle') checkIcon.remove();
                }
                
                // Select new
                button.classList.add('bg-primary-container', 'border-primary-container', 'card-selected-glow', 'scale-[1.02]');
                button.classList.remove('bg-surface-container-lowest', 'border-surface-variant/30');
                
                const iconBox = button.querySelector('div');
                iconBox.classList.add('bg-on-surface', 'text-primary-container');
                iconBox.classList.remove('bg-surface-container', 'text-secondary');
                
                // Add checkmark
                const check = document.createElement('span');
                check.className = 'material-symbols-outlined text-primary';
                check.innerText = 'check_circle';
                button.appendChild(check);
            });
        });
    </script>
