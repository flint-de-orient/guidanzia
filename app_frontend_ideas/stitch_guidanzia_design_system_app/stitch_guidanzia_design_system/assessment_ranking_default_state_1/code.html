<span class="material-symbols-outlined mr-2" data-icon="chevron_left">chevron_left</span>
<span class="font-label-bold text-label-bold">Back</span>
</button>
<!-- Continue Button (Active Style Logic: Dimmed Gold State) -->
<button class="flex items-center justify-center bg-surface-variant/40 text-on-surface-variant/40 rounded-full px-8 py-4 opacity-50 cursor-not-allowed transition-all duration-200">
<span class="font-label-bold text-label-bold mr-2">Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('.card-interaction').forEach(card => {
            card.addEventListener('click', function() {
                const radio = this.querySelector('.ml-auto');
                const isSelected = radio.classList.contains('bg-secondary');
                
                if(!isSelected) {
                    // Selection logic
                    radio.classList.remove('border-outline-variant');
                    radio.classList.add('bg-secondary', 'border-secondary', 'flex', 'items-center', 'justify-center');
                    radio.innerHTML = '<span class="material-symbols-outlined text-[14px] text-on-secondary font-bold" data-icon="check" style="font-variation-settings: \'opsz\' 16">check</span>';
                    this.classList.add('border-secondary', 'bg-surface-container-high');
                } else {
                    // Deselection logic
                    radio.classList.add('border-outline-variant');
                    radio.classList.remove('bg-secondary', 'border-secondary', 'flex', 'items-center', 'justify-center');
                    radio.innerHTML = '';
                    this.classList.remove('border-secondary', 'bg-surface-container-high');
                }

                // Check if any selections are made to enable Continue button
                const selectedCount = document.querySelectorAll('.bg-secondary').length;
                const continueBtn = document.querySelector('nav button:last-child');
                if(selectedCount > 0) {
                    continueBtn.classList.remove('bg-surface-variant/40', 'text-on-surface-variant/40', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary', 'dark:bg-primary-container', 'text-on-primary', 'dark:text-on-primary-container', 'shadow-[0_0_20px_rgba(240,192,77,0.4)]');
                } else {
                    continueBtn.classList.add('bg-surface-variant/40', 'text-on-surface-variant/40', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.remove('bg-primary', 'dark:bg-primary-container', 'text-on-primary', 'dark:text-on-primary-container', 'shadow-[0_0_20px_rgba(240,192,77,0.4)]');
                }
            });
        });
    </script>
