<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia | Assessment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&amp;family=Hanken+Grotesk:wght@100..900&amp;family=Sora:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "secondary": "#4f6700",
                "on-tertiary-fixed": "#002020",
                "tertiary-fixed": "#69f7f7",
                "error": "#ba1a1a",
                "on-error-container": "#93000a",
                "on-tertiary-container": "#006060",
                "on-primary-fixed": "#251a00",
                "on-secondary-fixed-variant": "#3a4d00",
                "surface-dim": "#d2d9f9",
                "surface": "#faf8ff",
                "surface-container-low": "#f2f3ff",
                "primary": "#785a00",
                "on-secondary-fixed": "#151f00",
                "surface-container-lowest": "#ffffff",
                "surface-tint": "#785a00",
                "primary-fixed-dim": "#f0c04d",
                "background": "#faf8ff",
                "secondary-container": "#c6f24e",
                "outline-variant": "#d2c5b0",
                "on-primary-container": "#6d5100",
                "on-secondary": "#ffffff",
                "surface-container-high": "#e3e7ff",
                "secondary-fixed-dim": "#abd533",
                "on-surface-variant": "#4e4635",
                "tertiary": "#006a6a",
                "on-tertiary-fixed-variant": "#004f50",
                "surface-container": "#ebedff",
                "on-background": "#131b32",
                "on-error": "#ffffff",
                "outline": "#807663",
                "on-tertiary": "#ffffff",
                "error-container": "#ffdad6",
                "surface-variant": "#dbe1ff",
                "inverse-on-surface": "#eff0ff",
                "surface-bright": "#faf8ff",
                "tertiary-container": "#4bdfdf",
                "primary-container": "#f5c451",
                "primary-fixed": "#ffdf9d",
                "on-primary-fixed-variant": "#5b4300",
                "on-primary": "#ffffff",
                "inverse-surface": "#282f48",
                "on-secondary-container": "#546d00",
                "inverse-primary": "#f0c04d",
                "secondary-fixed": "#c6f24e",
                "tertiary-fixed-dim": "#45dada",
                "on-surface": "#131b32",
                "surface-container-highest": "#dbe1ff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "stack-lg": "48px",
                "stack-sm": "8px",
                "margin-desktop": "40px",
                "margin-mobile": "20px",
                "stack-md": "24px",
                "unit": "4px",
                "gutter": "16px"
        },
        "fontFamily": {
                "display-lg": ["Sora"],
                "headline-md-mobile": ["Sora"],
                "headline-md": ["Sora"],
                "display-xl": ["Sora"],
                "headline-sm": ["Sora"],
                "body-lg": ["Be Vietnam Pro"],
                "label-bold": ["Hanken Grotesk"],
                "display-lg-mobile": ["Sora"],
                "body-md": ["Be Vietnam Pro"]
        },
        "fontSize": {
                "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
        }
    },
    },
  }
</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-tick {
            height: 4px;
            flex-grow: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-tick.active {
            height: 12px;
        }
        textarea:focus {
            outline: none;
        }
        .btn-glow-gold {
            box-shadow: 0 10px 15px -3px rgba(120, 90, 0, 0.3), 0 4px 6px -4px rgba(120, 90, 0, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-x-hidden">
<!-- Progress Rail Header -->
<header class="fixed top-0 left-0 w-full pt-8 px-margin-mobile z-50 bg-background">
<div class="flex items-end gap-1 w-full max-w-[600px] mx-auto h-4">
<!-- Ticks 1-20 Loop -->
<!-- Tick 1 (Completed) -->
<div class="progress-tick bg-primary-fixed-dim rounded-full"></div>
<!-- Tick 2 (Current) -->
<div class="progress-tick active bg-secondary rounded-full"></div>
<!-- Ticks 3-20 (Remaining) -->
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
<div class="progress-tick bg-surface-container-highest/20 rounded-full"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 px-margin-mobile pb-32 max-w-[600px] mx-auto w-full">
<!-- Sub-header -->
<div class="mb-stack-sm">
<span class="text-on-surface-variant font-label-bold text-label-bold tracking-wider uppercase">Module 1 · Question 2 of 20</span>
</div>
<!-- Question Headline -->
<h1 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-stack-sm">
            What is one project you've worked on that made you feel proud?
        </h1>
<!-- Optional Subline -->
<p class="text-on-surface-variant font-body-md text-body-md mb-stack-lg">
            Optional — skip if nothing comes to mind.
        </p>
<!-- Response Area (Academic Excellence Card) -->
<div class="relative group">
<!-- Soft shadow elevation -->
<div class="absolute -inset-1 bg-on-surface/5 blur-xl opacity-25 group-focus-within:opacity-40 transition duration-500"></div>
<div class="relative bg-surface-container-lowest border border-outline-variant/30 rounded-[24px] p-unit focus-within:border-on-surface/40 transition-all shadow-sm">
<textarea class="w-full min-h-[220px] bg-transparent text-on-surface font-body-lg text-body-lg p-stack-md resize-none placeholder:text-on-surface-variant/40 placeholder:italic focus:ring-0 border-none" id="response-input" maxlength="500" oninput="updateCharCount(this)" placeholder="Type your response here..."></textarea>
<!-- Character Counter -->
<div class="absolute bottom-6 right-6 text-on-surface-variant/50 font-label-bold text-sm">
<span class="" id="char-count">0</span>/500
                </div>
</div>
</div>
<!-- Atmospheric Micro-interaction (Visual Spacing Accent) -->
<div class="mt-stack-lg opacity-10 pointer-events-none">
<div class="w-1 h-32 bg-gradient-to-b from-primary to-transparent ml-4 rounded-full"></div>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 backdrop-blur-xl bg-surface/80">
<div class="max-w-[600px] mx-auto px-margin-mobile h-[100px] flex items-center justify-between">
<!-- Left Action: Skip -->
<button class="text-on-surface-variant font-label-bold text-label-bold hover:text-on-surface transition-colors px-4 py-2">
                Skip this
            </button>
<!-- Right Action: Continue -->
<button class="bg-primary-container text-on-primary-container font-label-bold text-label-bold px-10 h-14 rounded-full flex items-center justify-center btn-glow-gold active:scale-95 transition-all shadow-lg">
                Continue
                <span class="material-symbols-outlined ml-2 text-xl" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
</button>
</div>
<!-- Safe area padding for notched mobile devices -->
<div class="h-4 bg-transparent"></div>
</footer>
<script>
        function updateCharCount(textarea) {
            const count = textarea.value.length;
            document.getElementById('char-count').innerText = count;
            
            // Subtle visual feedback on counter
            const counter = document.getElementById('char-count');
            if (count > 450) {
                counter.classList.add('text-primary');
                counter.classList.remove('text-on-surface-variant/50');
            } else {
                counter.classList.remove('text-primary');
                counter.classList.add('text-on-surface-variant/50');
            }
        }

        // Focus interactions
        const textarea = document.getElementById('response-input');
        textarea.addEventListener('focus', () => {
            document.body.classList.add('focused-input');
        });
        textarea.addEventListener('blur', () => {
            document.body.classList.remove('focused-input');
        });
    </script>
</body></html>
