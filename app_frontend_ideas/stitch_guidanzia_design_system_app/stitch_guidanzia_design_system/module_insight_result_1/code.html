<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia - Insight Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "on-tertiary": "#ffffff",
                "surface-variant": "#dbe1ff",
                "tertiary-container": "#4bdfdf",
                "outline": "#807663",
                "surface-container-lowest": "#ffffff",
                "on-secondary-container": "#546d00",
                "surface-container-low": "#f2f3ff",
                "primary": "#785a00", // Graduation Gold based
                "surface-container-high": "#e3e7ff",
                "tertiary-fixed": "#69f7f7",
                "on-primary-fixed": "#251a00",
                "on-background": "#0b0a3d", // Deep Navy
                "surface-container-highest": "#dbe1ff",
                "secondary-fixed-dim": "#abd533",
                "on-tertiary-container": "#006060",
                "on-primary-fixed-variant": "#5b4300",
                "on-primary": "#ffffff",
                "secondary-fixed": "#c6f24e",
                "surface-tint": "#785a00",
                "surface": "#fcf8fd", // Cloud White
                "inverse-on-surface": "#eff0ff",
                "tertiary": "#006a6a",
                "on-secondary-fixed": "#151f00",
                "on-secondary": "#ffffff",
                "primary-fixed-dim": "#f0c04d",
                "on-surface-variant": "#4e4635",
                "primary-container": "#f5c451",
                "secondary": "#4f6700", // Lime based
                "inverse-surface": "#282f48",
                "surface-dim": "#d2d9f9",
                "on-primary-container": "#6d5100",
                "primary-fixed": "#ffdf9d",
                "on-error": "#ffffff",
                "on-secondary-fixed-variant": "#3a4d00",
                "tertiary-fixed-dim": "#45dada",
                "on-tertiary-fixed": "#002020",
                "error-container": "#ffdad6",
                "error": "#ba1a1a",
                "on-tertiary-fixed-variant": "#004f50",
                "surface-bright": "#fcf8fd",
                "inverse-primary": "#f0c04d",
                "on-error-container": "#93000a",
                "surface-container": "#ebedff",
                "background": "#fcf8fd", // Cloud White
                "on-surface": "#0b0a3d", // Deep Navy
                "secondary-container": "#c6f24e",
                "outline-variant": "#d2c5b0"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "unit": "4px",
                "gutter": "16px",
                "margin-mobile": "20px",
                "stack-md": "24px",
                "stack-sm": "8px",
                "margin-desktop": "40px",
                "stack-lg": "48px"
            },
            "fontFamily": {
                "display-lg-mobile": ["Sora"],
                "headline-sm": ["Sora"],
                "body-md": ["Be Vietnam Pro"],
                "label-bold": ["Hanken Grotesk"],
                "display-lg": ["Sora"],
                "body-lg": ["Be Vietnam Pro"],
                "headline-md-mobile": ["Sora"],
                "display-xl": ["Sora"],
                "headline-md": ["Sora"]
            },
            "fontSize": {
                "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "800"}],
                "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                "headline-md-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fcf8fd; /* Cloud White */
            color: #0b0a3d; /* Deep Navy */
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .acid-glow {
            background: radial-gradient(circle at center, rgba(171, 213, 51, 0.1) 0%, rgba(252, 248, 253, 0) 70%);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .numeral-outline {
            -webkit-text-stroke: 2px #785a00; /* Graduation Gold Primary */
            color: transparent;
        }

        .button-glow {
            box-shadow: 0 8px 24px rgba(120, 90, 0, 0.15);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .transition-active:active {
            transform: scale(0.96);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- Insight Card Canvas -->
<main class="relative w-full max-w-md h-screen flex flex-col items-center justify-between px-margin-mobile py-12 overflow-hidden bg-background">
<!-- Background Radial Glow -->
<div class="acid-glow"></div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center text-center flex-grow space-y-stack-lg">
<!-- 1. Outlined Numeral -->
<div class="flex flex-col items-center">
<span class="numeral-outline font-display-xl text-display-xl leading-none block" style="font-size: 72px;">
                2
            </span>
<span class="font-label-bold text-label-bold text-secondary uppercase tracking-widest mt-2">
                Module Complete
            </span>
</div>
<!-- 2. Headline & Observation -->
<div class="space-y-stack-md">
<h1 class="font-headline-md text-headline-md text-on-surface px-4">
                Here's what we're seeing
            </h1>
<p class="font-body-lg text-body-lg text-on-surface/80 max-w-xs mx-auto leading-relaxed">
                You show a strong preference for <span class="text-secondary font-semibold">collaborative problem-solving</span> and structured environments. Your analytical skills seem to shine when working on digital-first challenges.
            </p>
</div>
<!-- 3. Feature Chips -->
<div class="flex flex-row flex-wrap justify-center gap-stack-sm">
<span class="bg-surface-container border-2 border-outline-variant/30 px-4 py-2 rounded-xl font-label-bold text-label-bold text-on-surface">
                Creative
            </span>
<span class="bg-surface-container border-2 border-outline-variant/30 px-4 py-2 rounded-xl font-label-bold text-label-bold text-on-surface">
                Analytical
            </span>
<span class="bg-surface-container border-2 border-outline-variant/30 px-4 py-2 rounded-xl font-label-bold text-label-bold text-on-surface">
                Collaborative
            </span>
</div>
</div>
<!-- Bottom-anchored Button -->
<div class="relative z-10 w-full px-margin-mobile pb-8">
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-bold text-body-lg rounded-full flex items-center justify-center gap-2 button-glow transition-all transition-active hover:brightness-105 active:opacity-90">
            Keep going
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const numeral = document.querySelector('.numeral-outline');
        const chips = document.querySelectorAll('.bg-surface-container');
        
        // Subtle entrance animation
        numeral.animate([
            { transform: 'scale(0.8)', opacity: 0 },
            { transform: 'scale(1)', opacity: 1 }
        ], {
            duration: 800,
            easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
        });

        chips.forEach((chip, index) => {
            chip.animate([
                { transform: 'translateY(10px)', opacity: 0 },
                { transform: 'translateY(0)', opacity: 1 }
            ], {
                duration: 600,
                delay: 400 + (index * 100),
                fill: 'forwards',
                easing: 'ease-out'
            });
        });
    });
</script>
</body></html>
