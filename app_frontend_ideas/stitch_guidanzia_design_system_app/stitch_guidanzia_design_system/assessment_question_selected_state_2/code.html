<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Top AppBar (Injected from JSON) -->

</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary italic">Guidanzia</h1>
<div class="w-8 h-8 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a young Indian student with a friendly and ambitious expression. The lighting is crisp and high-contrast, reflecting a modern fintech-style aesthetic. The background is a soft-focus office or university setting with hints of navy and acid lime lighting, aligning with the brand's premium dark mode identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqtU3bIdIJ6c6AaLkvtd-pbWUJCJFVM5Fdp6AJgg-fdbXsPqO0Hcbv46rQ_AzzsOamHvqNv-l_twUkhQghEupK5VuqALtAV4eaXJsJS3KYhNtcsslrwvj_k4hM_tkHJFLqzMSZqqDnfGNsf8c_3i2ELfbIyoTCxisC7YWKXogrNYY6mgvGM8tNqhYY8i33kJ8bEqO_kotFCar2djfixAKDRRkWRSJGuLgTqwjUBT45pPyxjU86Y_8fs4FQKHb9co3-aOLFWRtZk24"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md pt-24 pb-32 px-margin-mobile flex-1 flex flex-col">
<!-- Progress Bar Section -->
<div class="mb-stack-md">
<div class="flex justify-between items-end mb-2">
<span class="font-label-bold text-label-bold text-secondary uppercase tracking-widest">Assessment Stage 02</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">4/12 Questions</span>
</div>
<div class="h-3 w-full bg-surface-container rounded-full overflow-hidden border-2 border-outline-variant p-0.5">
<div class="h-full bg-secondary rounded-full" style="width: 33%"></div>
</div>
</div>
<!-- Question Header -->
<div class="mb-stack-lg">
<h2 class="font-headline-sm text-headline-sm text-primary-fixed mb-stack-sm">Which work environment fuels your energy most?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Pick the setting where you feel most productive and creative.</p>
</div>
<!-- Option Cards (Selected State Focus) -->
<div class="space-y-stack-md">
<!-- Option 1 (Unselected) -->
<button class="w-full group text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-200 hover:bg-surface-container-high">
<div class="w-12 h-12 flex-shrink-0 bg-surface-container-highest border-2 border-outline-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="hub">hub</span>
</div>
<div class="flex-1">
<h3 class="font-label-bold text-label-bold text-on-surface">Structured Teams</h3>
<p class="text-sm text-on-surface-variant">Clear roles and collaborative hierarchy.</p>
</div>
</button>
<!-- Option 2 (SELECTED STATE) -->
<button class="w-full group text-left bg-primary-container border-2 border-primary text-on-primary-container rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-300 transform -translate-y-1 selected-glow">
<div class="w-12 h-12 flex-shrink-0 bg-on-primary-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary icon-fill" data-icon="rocket_launch" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</div>
<div class="flex-1">
<h3 class="font-label-bold text-label-bold text-on-primary-fixed">Fast-Paced Startups</h3>
<p class="text-sm text-on-primary-container font-medium">Dynamic, high-impact, and rapidly evolving.</p>
</div>
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-on-primary-container" data-icon="check_circle">check_circle</span>
</div>
</button>
<!-- Option 3 (Unselected) -->
<button class="w-full group text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-200 hover:bg-surface-container-high">
<div class="w-12 h-12 flex-shrink-0 bg-surface-container-highest border-2 border-outline-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="home_work">home_work</span>
</div>
<div class="flex-1">
<h3 class="font-label-bold text-label-bold text-on-surface">Remote Autonomy</h3>
<p class="text-sm text-on-surface-variant">Flexibility to work from anywhere, anytime.</p>
</div>
</button>
<!-- Option 4 (Unselected) -->
<button class="w-full group text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-200 hover:bg-surface-container-high">
<div class="w-12 h-12 flex-shrink-0 bg-surface-container-highest border-2 border-outline-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="public">public</span>
</div>
<div class="flex-1">
<h3 class="font-label-bold text-label-bold text-on-surface">Mission-Driven NGO</h3>
<p class="text-sm text-on-surface-variant">Focus on social impact and community service.</p>
</div>
</button>

<!-- Bottom Navigation / Action Area -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex flex-col items-center px-margin-mobile pb-8 pt-4 bg-gradient-to-t from-background via-background to-transparent">
<button class="w-full max-w-md h-[56px] bg-primary text-on-primary font-label-bold text-lg rounded-full flex items-center justify-center gap-2 continue-glow active:scale-95 transition-all duration-200">
            Continue
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-4 text-xs text-on-surface-variant opacity-60">Step 4 of 12 — 2 minutes remaining</p>
</footer>
<!-- Interactive micro-interaction script -->
<script>
        document.querySelectorAll('button:not(.bg-primary)').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected states from others
                document.querySelectorAll('button').forEach(b => {
                    if (b.classList.contains('bg-primary-container')) {
                        b.className = "w-full group text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-200 hover:bg-surface-container-high";
                        const iconCont = b.querySelector('div:first-child');
                        iconCont.className = "w-12 h-12 flex-shrink-0 bg-surface-container-highest border-2 border-outline-variant rounded-lg flex items-center justify-center";
                        const icon = iconCont.querySelector('span');
                        icon.className = "material-symbols-outlined text-tertiary";
                        icon.style.fontVariationSettings = "'FILL' 0";
                        const checkIcon = b.querySelector('div:last-child');
                        if (checkIcon && checkIcon.querySelector('[data-icon="check_circle"]')) checkIcon.remove();
                    }
                });

                // Set this as selected
                this.className = "w-full group text-left bg-primary-container border-2 border-primary text-on-primary-container rounded-xl p-stack-md flex items-center gap-gutter transition-all duration-300 transform -translate-y-1 selected-glow";
                const iconCont = this.querySelector('div:first-child');
                iconCont.className = "w-12 h-12 flex-shrink-0 bg-on-primary-container rounded-lg flex items-center justify-center";
                const icon = iconCont.querySelector('span');
                icon.className = "material-symbols-outlined text-primary icon-fill";
                icon.style.fontVariationSettings = "'FILL' 1";
                
                // Add checkmark if not exists
                if (!this.querySelector('[data-icon="check_circle"]')) {
                    const checkDiv = document.createElement('div');
                    checkDiv.className = "flex-shrink-0";
                    checkDiv.innerHTML = '<span class="material-symbols-outlined text-on-primary-container" data-icon="check_circle">check_circle</span>';
                    this.appendChild(checkDiv);
                }
            });
        });
    </script>
</body></html>
