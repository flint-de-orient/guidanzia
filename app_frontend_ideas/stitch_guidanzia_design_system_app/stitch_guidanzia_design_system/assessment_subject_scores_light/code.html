<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-rail {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }
        .tick {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .tick-completed { background-color: #f5c451; } /* Graduation Gold */
        .tick-active { 
            background-color: #c6f24e; /* Lime accent */
            height: 10px; 
            box-shadow: 0 0 10px rgba(198, 242, 78, 0.4);
        }
        .tick-muted { background-color: #e3e7ff; }

        .score-pill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .score-pill.active {
            box-shadow: 0 4px 12px rgba(120, 90, 0, 0.15);
        }
        .btn-glow {
            box-shadow: 0 8px 24px rgba(245, 196, 81, 0.4);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<span class="font-label-bold text-label-bold text-on-surface-variant">Module 2 · Question 6 of 20</span>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-stack-md pb-32 max-w-md mx-auto">
<!-- Question Intro -->
<div class="mb-stack-lg">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-background mb-unit">
                What are your typical scores in these subjects?
            </h1>
<p class="font-label-bold text-label-bold text-on-surface-variant">
                Pick the closest band for each.
            </p>
</div>
<!-- Subject Sections -->
<div class="space-y-stack-lg">
<!-- Section: Mathematics -->
<section class="subject-group" id="subject-math">
<div class="flex items-center gap-2 mb-gutter">
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Mathematics</span>
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all">80–90</button>
<button class="score-pill active px-gutter py-3 rounded-full border-2 border-primary bg-primary font-label-bold text-label-bold text-on-primary shrink-0 transition-all">90+</button>
</div>
<div class="mt-stack-md h-[1px] w-full bg-surface-variant/30"></div>
</section>
<!-- Section: Physics -->
<section class="subject-group" id="subject-physics">
<div class="flex items-center gap-2 mb-gutter">
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Physics</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary hidden"></div>
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary-container shrink-0 transition-all bg-surface-container-lowest text-on-surface border-outline-variant" onclick="selectScore(this)">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary-container shrink-0 transition-all bg-surface-container-lowest text-on-surface border-outline-variant" onclick="selectScore(this)">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary-container shrink-0 transition-all active bg-primary text-on-primary border-primary" onclick="selectScore(this)">80–90</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">90+</button>
</div>
<div class="mt-stack-md h-[1px] w-full bg-surface-variant/30"></div>
</section>

<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Computer Science</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary hidden"></div>
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary-container shrink-0 transition-all active bg-primary text-on-primary border-primary" onclick="selectScore(this)">80–90</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-container-lowest font-label-bold text-label-bold text-on-surface hover:border-primary-container shrink-0 transition-all" onclick="selectScore(this)">90+</button>

<!-- Fixed Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-[60] px-margin-mobile py-gutter bg-background/80 backdrop-blur-xl border-t border-surface-variant/20">
<div class="max-w-md mx-auto flex items-center justify-between gap-gutter">
<!-- Back Button -->
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high active:scale-90 transition-all">
<span class="material-symbols-outlined text-[32px]">chevron_left</span>
</button>
<!-- Continue Button -->
<button class="flex-1 h-14 rounded-full font-label-bold text-label-bold transition-all duration-300 bg-primary text-on-primary btn-glow cursor-pointer active:scale-95" id="continue-btn">
                Continue
            </button>
</div>
</footer>
<script>
        const selections = {
            math: true, // Hardcoded for demo state
            physics: false,
            cs: false
        };

        function selectScore(element) {
            const parent = element.closest('.subject-group');
            const buttons = parent.querySelectorAll('.score-pill');
            const subjectId = parent.id.replace('subject-', '');
            const dot = parent.querySelector('.bg-primary');

            // Toggle classes
            buttons.forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
            });

            element.classList.add('active', 'bg-primary', 'text-on-primary', 'border-primary');
            element.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');

            // Hide the unanswered dot
            if (dot) dot.classList.add('hidden');

            // Update state
            selections[subjectId] = true;
            checkFormCompletion();
            
            // Subtle haptic feel
            element.classList.add('scale-95');
            setTimeout(() => element.classList.remove('scale-95'), 100);
        }

        function checkFormCompletion() {
            const btn = document.getElementById('continue-btn');
            if (Object.values(selections).every(v => v === true)) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('bg-primary', 'text-on-primary', 'btn-glow', 'cursor-pointer', 'active:scale-95');
                btn.removeAttribute('disabled');
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
        
        // Initial check for hardcoded state
        checkFormCompletion();
    </script>
</body></html>
