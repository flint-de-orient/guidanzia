<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }
        .tick {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .tick-completed { background-color: #f0c04d; }
        .tick-active { 
            background-color: #abd533; 
            height: 10px; 
            box-shadow: 0 0 10px rgba(171, 213, 51, 0.4);
        }
        .tick-muted { background-color: #2c344c; }

        .score-pill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .score-pill.active {
            box-shadow: 0 0 15px rgba(240, 192, 77, 0.3);
        }
        .btn-glow {
            box-shadow: 0 0 20px rgba(240, 192, 77, 0.4);

        .hide-scrollbar::-webkit-scrollbar { display: none; }

<!-- 20 ticks: 1-5 gold, 6 lime/tall, 7-20 muted -->

</div>
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface-variant">Module 2 · Question 6 of 20</span>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-stack-md pb-32 max-w-md mx-auto">
<!-- Question Intro -->
<div class="mb-stack-lg">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-background mb-unit">
                What are your typical scores in these subjects?
            </h1>
<p class="font-label-bold text-label-bold text-on-surface-variant">
                Pick the closest band for each.
            </p>
</div>
<!-- Subject Sections -->
<div class="space-y-stack-lg">
<!-- Section: Mathematics -->
<section class="subject-group" id="subject-math">
<div class="flex items-center gap-2 mb-gutter">
<span class="text-[10px] uppercase tracking-widest font-bold text-primary-fixed">Mathematics</span>
<!-- Dot omitted for active/answered logic demo: Math will be shown as answered (90+) -->
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all">80–90</button>
<button class="score-pill active px-gutter py-3 rounded-full border-2 border-primary bg-primary font-label-bold text-label-bold text-on-primary shrink-0 transition-all">90+</button>
</div>
<div class="mt-stack-md h-[1px] w-full bg-surface-variant/50"></div>
</section>
<!-- Section: Physics -->
<section class="subject-group" id="subject-physics">
<div class="flex items-center gap-2 mb-gutter">
<span class="text-[10px] uppercase tracking-widest font-bold text-primary-fixed">Physics</span>
<div class="w-1.5 h-1.5 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)] hidden"></div>
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary shrink-0 transition-all bg-surface-dim text-on-surface border-outline-variant" onclick="selectScore(this)">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary shrink-0 transition-all bg-surface-dim text-on-surface border-outline-variant" onclick="selectScore(this)">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary shrink-0 transition-all active bg-primary text-on-primary border-primary" onclick="selectScore(this)">80–90</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">90+</button>
</div>
<div class="mt-stack-md h-[1px] w-full bg-surface-variant/50"></div>

<div class="w-1.5 h-1.5 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)] hidden"></div>
</div>
<div class="flex flex-wrap gap-3 pb-unit">
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">Below 50</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">50–65</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">65–80</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 font-label-bold text-label-bold hover:border-primary shrink-0 transition-all active bg-primary text-on-primary border-primary" onclick="selectScore(this)">80–90</button>
<button class="score-pill px-gutter py-3 rounded-full border-2 border-outline-variant bg-surface-dim font-label-bold text-label-bold text-on-surface hover:border-primary shrink-0 transition-all" onclick="selectScore(this)">90+</button>

<!-- Fixed Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-[60] px-margin-mobile py-gutter bg-surface-dim/80 backdrop-blur-xl border-t border-surface-variant/30">
<div class="max-w-md mx-auto flex items-center justify-between gap-gutter">
<!-- Back Button -->
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 active:scale-90 transition-all">
<span class="material-symbols-outlined text-[32px]">chevron_left</span>
</button>
<!-- Continue Button (Disabled initially in this mock logic) -->
<button class="flex-1 h-14 rounded-full font-label-bold text-label-bold transition-all duration-300 bg-primary text-on-primary btn-glow cursor-pointer active:scale-95" id="continue-btn">
                Continue
            </button>
</div>
</footer>
<script>
        const selections = {
            math: true, // Hardcoded for demo state
            physics: false,
            cs: false
        };

        function selectScore(element) {
            const parent = element.closest('.subject-group');
            const buttons = parent.querySelectorAll('.score-pill');
            const subjectId = parent.id.replace('subject-', '');
            const dot = parent.querySelector('.bg-amber-500');

            // Toggle classes
            buttons.forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('bg-surface-dim', 'text-on-surface', 'border-outline-variant');
            });

            element.classList.add('active', 'bg-primary', 'text-on-primary', 'border-primary');
            element.classList.remove('bg-surface-dim', 'text-on-surface', 'border-outline-variant');

            // Hide the unanswered dot
            if (dot) dot.classList.add('hidden');

            // Update state
            selections[subjectId] = true;
            checkFormCompletion();
            
            // Subtle haptic feel
            element.classList.add('scale-95');
            setTimeout(() => element.classList.remove('scale-95'), 100);
        }

        function checkFormCompletion() {
            const btn = document.getElementById('continue-btn');
            if (Object.values(selections).every(v => v === true)) {
                btn.classList.remove('bg-primary/40', 'text-on-primary-fixed/50', 'cursor-not-allowed');
                btn.classList.add('bg-primary', 'text-on-primary', 'btn-glow', 'cursor-pointer', 'active:scale-95');
                btn.removeAttribute('disabled');
            }
        }
        
        // Initial check for hardcoded state
        checkFormCompletion();
    </script>


</body></html>
