<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guidanzia | Insight Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-effect {
            position: relative;
            overflow: hidden;
            background-color: #171f36; /* surface-container */
        }
        .shimmer-effect::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(171, 213, 51, 0.1),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }
        .radial-glow {
            background: radial-gradient(circle at center, rgba(171, 213, 51, 0.08) 0%, rgba(10, 18, 41, 0) 70%);
        }
        .progress-indeterminate {
            width: 30%;
            height: 100%;
            background-color: #abd533; /* secondary / acid lime */
            animation: indeterminate 2s infinite ease-in-out;
        }
        @keyframes indeterminate {
            0% { left: -30%; }
            100% { left: 100%; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container": "#171f36",
                      "on-secondary-container": "#2f3f00",
                      "on-surface": "#dbe1ff",
                      "on-primary-fixed-variant": "#5b4300",
                      "primary-fixed-dim": "#f0c04d",
                      "on-primary-container": "#6d5100",
                      "inverse-surface": "#dbe1ff",
                      "error": "#ffb4ab",
                      "inverse-primary": "#785a00",
                      "primary-fixed": "#ffdf9d",
                      "surface-container-highest": "#2c344c",
                      "on-error-container": "#ffdad6",
                      "tertiary-fixed": "#69f7f7",
                      "tertiary-container": "#4bdfdf",
                      "outline-variant": "#4e4635",
                      "tertiary-fixed-dim": "#45dada",
                      "on-tertiary": "#003737",
                      "secondary": "#abd533",
                      "primary": "#ffe4af",
                      "error-container": "#93000a",
                      "on-secondary-fixed": "#151f00",
                      "on-surface-variant": "#d2c5b0",
                      "surface-container-high": "#222941",
                      "on-primary-fixed": "#251a00",
                      "secondary-fixed": "#c6f24e",
                      "surface": "#0a1229",
                      "surface-bright": "#313851",
                      "on-secondary": "#273500",
                      "on-tertiary-fixed": "#002020",
                      "on-secondary-fixed-variant": "#3a4d00",
                      "inverse-on-surface": "#282f48",
                      "on-tertiary-fixed-variant": "#004f50",
                      "outline": "#9b8f7c",
                      "secondary-container": "#89b100",
                      "on-background": "#dbe1ff",
                      "on-error": "#690005",
                      "primary-container": "#f5c451",
                      "surface-variant": "#2c344c",
                      "secondary-fixed-dim": "#abd533",
                      "surface-tint": "#f0c04d",
                      "on-primary": "#3f2e00",
                      "on-tertiary-container": "#006060",
                      "tertiary": "#6efcfc",
                      "surface-container-lowest": "#050d24",
                      "background": "#0a1229",
                      "surface-dim": "#0a1229",
                      "surface-container-low": "#131b32"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "stack-sm": "8px",
                      "stack-lg": "48px",
                      "margin-mobile": "20px",
                      "unit": "4px",
                      "stack-md": "24px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "label-bold": ["Hanken Grotesk"],
                      "body-md": ["Be Vietnam Pro"],
                      "body-lg": ["Be Vietnam Pro"],
                      "headline-sm": ["Sora"],
                      "display-xl": ["Sora"],
                      "display-lg-mobile": ["Sora"],
                      "headline-md": ["Sora"],
                      "headline-md-mobile": ["Sora"],
                      "display-lg": ["Sora"]
              },
              "fontSize": {
                      "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.7", "fontWeight": "400"}],
                      "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Subtle Acid Lime Radial Glow Layer -->
<div class="fixed inset-0 radial-glow pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-margin-mobile">
<!-- Center-aligned Container -->
<div class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Outlined Numeral "2" -->
<div class="flex items-center justify-center">
<span class="font-display-xl text-display-xl text-transparent" style="-webkit-text-stroke: 2px #abd533; opacity: 0.8;">
                    2
                </span>
</div>
<!-- Headline -->
<div class="space-y-stack-md">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight">
                    Here's what we're seeing
                </h1>
<!-- Shimmering Skeleton Lines -->
<div class="space-y-4 w-full">
<div class="h-4 w-full rounded-full shimmer-effect border border-outline-variant"></div>
<div class="h-4 w-[92%] mx-auto rounded-full shimmer-effect border border-outline-variant"></div>
<div class="h-4 w-[75%] mx-auto rounded-full shimmer-effect border border-outline-variant"></div>
</div>
<!-- Indeterminate Progress Bar -->
<div class="relative w-full h-1 bg-surface-container-highest rounded-full overflow-hidden mt-stack-md border border-outline-variant/30">
<div class="progress-indeterminate absolute top-0"></div>
</div>
</div>
</div>
</main>
<!-- Bottom-anchored Action (Disabled State) -->
<footer class="relative z-10 p-margin-mobile flex justify-center pb-12">
<button class="w-full max-w-md h-[56px] rounded-full bg-primary/20 text-on-primary-container/40 font-label-bold text-label-bold flex items-center justify-center cursor-not-allowed border-2 border-outline-variant" disabled="">
            Keep going
        </button>
</footer>
<!-- Background Atmospheric Effect -->
<script>
        // Subtle drift for the radial glow
        const glow = document.querySelector('.radial-glow');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(171, 213, 51, 0.08) 0%, rgba(10, 18, 41, 0) 70%)`;
        });
    </script>
</body></html>
